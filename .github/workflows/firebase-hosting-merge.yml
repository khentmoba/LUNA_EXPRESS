name: Deploy to Firebase on merge
on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - run: flutter pub get

      - run: flutter build web --release --dart-define=RECAPTCHA_SITE_KEY=${{ secrets.RECAPTCHA_SITE_KEY }}

      - run: npm ci
        working-directory: functions

      - run: npm run build
        working-directory: functions

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LUNAEXPRESS }}
          channelId: live
          projectId: lunaexpress

      # Secrets (TELEGRAM_*, PAYMONGO_*) are read from Secret Manager at runtime
      # (see functions/src/index.ts). Set values once via:
      #   firebase functions:secrets:set TELEGRAM_TOKEN (etc.)
      # No .env file needed — never commit secret values.

      - name: Delete conflicting functions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LUNAEXPRESS }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$HOME"/service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/service-account.json"
          npx firebase-tools functions:delete createCheckoutSession paymongoWebhook --project lunaexpress --non-interactive --force || true

      - name: Deploy Cloud Functions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LUNAEXPRESS }}
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/service-account.json"
          npx firebase-tools deploy --only functions --project lunaexpress --non-interactive --force
