<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Luna Bites & Delights — Fast food ordering app">

  <!-- iOS PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Luna Bites">
  <meta name="theme-color" content="#EC1C72">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- PWA manifest & icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <title>Order · Luna Bites &amp; Delights</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #FEB7C9;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    /* ── UPDATE BANNER ─────────────────────────── */
    #update-banner {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 99999;
      background: #FFFAFB;
      color: #2A0F1E;
      border-bottom: 2px solid #EC1C72;
      padding: 12px 20px;
      align-items: center;
      gap: 12px;
      box-shadow: 0 14px 26px -18px rgba(110, 4, 50, 0.8);
      animation: slideDown 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #update-banner.show { display: flex; }
    @keyframes slideDown {
      from { transform: translateY(-110%); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
    #update-banner .icon  { width: 22px; height: 22px; flex-shrink: 0; color: #B30E52; }
    #update-banner .text  { flex: 1; }
    #update-banner .title { font-weight: 800; font-size: 14px; }
    #update-banner .sub   { font-size: 12px; color: #6B3A52; margin-top: 2px; }
    #update-btn {
      background: #D91566;
      color: #FFFFFF; border: none; border-radius: 6px;
      min-height: 44px; padding: 0 18px; font: inherit; font-size: 14px; font-weight: 800;
      cursor: pointer; white-space: nowrap;
      box-shadow: inset 0 0 0 3px #D91566, inset 0 0 0 4.5px rgba(255,255,255,.6);
      transition: transform 0.1s;
    }
    #update-btn:active { transform: translateY(1px); }
    #update-btn:focus-visible { outline: 3px solid #2A0F1E; outline-offset: 3px; }

    /* ── LOADING SCREEN ────────────────────────── */
    #loading-screen {
      position: fixed; inset: 0;
      background-color: #FEB7C9;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 9998;
      transition: opacity 0.5s ease;
    }
    #loading-screen.fade-out { opacity: 0; pointer-events: none; }
    .loading-logo  { width: 150px; height: auto; margin-bottom: 22px; }
    .loading-title { color: #2A0F1E; font-size: 16px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; }
    .loading-dots  { display: flex; gap: 8px; margin-top: 22px; }
    .dot { width: 8px; height: 8px; background: #D91566; border-radius: 2px; animation: blink 1.2s ease-in-out infinite; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .dot, #update-banner { animation: none; }
      .dot { opacity: .7; }
    }
  </style>
</head>
<body>

  <!-- Loading screen (fades out once Flutter is ready) -->
  <div id="loading-screen">
    <img class="loading-logo" src="icons/Icon-512.png" width="512" height="512" alt="Luna Bites &amp; Delights">
    <div class="loading-title">Opening the order slip</div>
    <div class="loading-dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

  <!-- Update banner (shown when new version detected) -->
  <div id="update-banner">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.6-4.5L4 8"/><path d="M4 3v5h5"/><path d="M4 13a8 8 0 0 0 14.6 4.5L20 16"/><path d="M20 21v-5h-5"/></svg>
    <div class="text">
      <div class="title">A new version of the menu is ready</div>
      <div class="sub">Update to see the latest items and prices.</div>
    </div>
    <button id="update-btn" onclick="applyUpdate()">Update now</button>
  </div>

  <script>
    var _refreshing = false;
    var VERSION_STORAGE_KEY = 'luna_app_version';
    var _pendingServerVersion = null; 

    // ─────────────────────────────────────────
    //  LOADING SCREEN
    // ─────────────────────────────────────────
    function hideLoadingScreen() {
      var screen = document.getElementById('loading-screen');
      if (screen) {
        screen.classList.add('fade-out');
        setTimeout(function() { screen.style.display = 'none'; }, 500);
      }
    }
    setTimeout(hideLoadingScreen, 8000);

    // ─────────────────────────────────────────
    //  UPDATE BANNER
    // ─────────────────────────────────────────
    function showUpdateBanner() {
      var banner = document.getElementById('update-banner');
      if (banner) banner.classList.add('show');
    }

    function applyUpdate() {
      // 1. Hide banner immediately
      var banner = document.getElementById('update-banner');
      if (banner) {
        banner.classList.remove('show');
        banner.style.display = 'none';
      }

      // 2. Commit the new version to storage
      if (_pendingServerVersion) {
        localStorage.setItem(VERSION_STORAGE_KEY, _pendingServerVersion);
      }

      // 3. Hard refresh: wipe ALL service worker caches so the next load is fresh
      if ('caches' in window) {
        caches.keys().then(function(names) {
          names.forEach(function(name) { caches.delete(name); });
        });
      }

      // 4. Tell the *WAITING* Service Worker to take over (This fixes the Android/Windows loop)
      if (navigator.serviceWorker) {
        navigator.serviceWorker.getRegistration().then(function(reg) {
          if (reg && reg.waiting) {
            reg.waiting.postMessage({ type: 'SKIP_WAITING' });
          }
        });
      }

      // 5. Force hard reload as a safety net if controllerchange doesn't fire fast enough
      setTimeout(function() {
        if (!_refreshing) {
          _refreshing = true;
          var next = new URL(window.location.href);
          next.searchParams.set('v', new Date().getTime());
          window.location.replace(next.toString());
        }
      }, 400);
    }

    // ─────────────────────────────────────────
    //  iOS VERSION POLLING
    // ─────────────────────────────────────────
    function checkVersionUpdate() {
      fetch('version.json?t=' + Date.now(), {
        cache: 'no-store',
        headers: { 'Cache-Control': 'no-cache, no-store, must-revalidate' }
      })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        var serverVersion = data.version;
        var storedVersion = localStorage.getItem(VERSION_STORAGE_KEY);

        console.log('[Version] Server:', serverVersion, '| Stored:', storedVersion);

        if (!storedVersion) {
          localStorage.setItem(VERSION_STORAGE_KEY, serverVersion);
          return;
        }

        if (storedVersion !== serverVersion) {
          console.log('[Version] Update detected! Showing banner...');
          _pendingServerVersion = serverVersion; 
          showUpdateBanner();
        }
      })
      .catch(function(err) {
        console.log('[Version] Network check failed:', err);
      });
    }

    checkVersionUpdate();
    setInterval(checkVersionUpdate, 60000);

    document.addEventListener('visibilitychange', function() {
      if (!document.hidden) {
        checkVersionUpdate();
      }
    });

    // ─────────────────────────────────────────
    //  PWA INSTALL BRIDGE
    // ─────────────────────────────────────────
    window._pwaPromptReady = false;
    window._pwaPromptEvent = null;

    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      window._pwaPromptEvent = e;
      window._pwaPromptReady = true;
    });

    window._pwaTriggerInstall = function() {
      if (window._pwaPromptEvent) {
        window._pwaPromptEvent.prompt();
        window._pwaPromptEvent.userChoice.then(function() {
          window._pwaPromptEvent = null;
          window._pwaPromptReady = false;
        });
      }
    };

    window.addEventListener('appinstalled', function() {
      window._pwaPromptReady = false;
      window._pwaPromptEvent = null;
    });

    // ─────────────────────────────────────────
    //  SERVICE WORKER (Android & iOS 11.3+)
    // ─────────────────────────────────────────
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(function(registration) {
        console.log('[SW] Registered');

        document.addEventListener('visibilitychange', function() {
          if (!document.hidden) registration.update().catch(function(){});
        });

        setInterval(function() {
          registration.update().catch(function(){});
        }, 60000);

        function onWaiting() {
          showUpdateBanner();
        }

        if (registration.waiting) onWaiting();

        registration.addEventListener('updatefound', function() {
          var nw = registration.installing;
          if (!nw) return;
          nw.addEventListener('statechange', function() {
            if (nw.state === 'installed' && navigator.serviceWorker.controller) {
              onWaiting();
            }
          });
        });

      }).catch(function(e) {
        console.warn('[SW] Registration failed:', e);
      });

      // When the new Service Worker successfully takes over, refresh the page automatically
      navigator.serviceWorker.addEventListener('controllerchange', function() {
        if (!_refreshing) {
          _refreshing = true;
          var next = new URL(window.location.href);
          next.searchParams.set('v', new Date().getTime());
          window.location.replace(next.toString());
        }
      });
    }

    // ── KITCHEN / STAFF ORDER ALERT CHIME ──────────────────
    window.playOrderAlert = function() {
      try {
        var AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        var ctx = new AudioCtx();
        if (ctx.state === 'suspended') {
          ctx.resume();
        }
        var now = ctx.currentTime;

        // Tone 1: 659 Hz (E5)
        var osc1 = ctx.createOscillator();
        var gain1 = ctx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(659.25, now);
        gain1.gain.setValueAtTime(0.25, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        osc1.connect(gain1);
        gain1.connect(ctx.destination);
        osc1.start(now);
        osc1.stop(now + 0.35);

        // Tone 2: 880 Hz (A5)
        var osc2 = ctx.createOscillator();
        var gain2 = ctx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(880.00, now + 0.15);
        gain2.gain.setValueAtTime(0.3, now + 0.15);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.65);
        osc2.connect(gain2);
        gain2.connect(ctx.destination);
        osc2.start(now + 0.15);
        osc2.stop(now + 0.65);
      } catch (e) {
        console.warn('[AudioAlert] Web Audio not available or blocked:', e);
      }
    };
  </script>

  <!-- Flutter bootstrap -->
  <script src="flutter.js" defer></script>
  <script>
    window.addEventListener('load', function() {
      if (window._flutter && window._flutter.loader) {
        // Modern Flutter 3.10+ loader
        window._flutter.loader.loadEntrypoint({
          onEntrypointLoaded: function(engineInitializer) {
            engineInitializer.initializeEngine().then(function(appRunner) {
              appRunner.runApp();
              hideLoadingScreen();
            });
          }
        });
      } else {
        // Fallback: flutter_bootstrap.js style build
        var s = document.createElement('script');
        s.src = 'flutter_bootstrap.js';
        s.onload = function() { setTimeout(hideLoadingScreen, 1500); };
        document.body.appendChild(s);
      }
    });
  </script>

</body>
</html>
