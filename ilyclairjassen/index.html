// ─────────────────────────────────────────────────────────────
// REALTIME — Supabase v2 SDK channel subscription
// Falls back gracefully if SDK or connection unavailable
// ─────────────────────────────────────────────────────────────
var RT = {
  _channels: {},
  _statusEl: null,

  // Show/hide the sync indicator
  _showStatus: function(msg, ok){
    if(!RT._statusEl){
      RT._statusEl = document.createElement('div');
      RT._statusEl.style.cssText = [
        'position:fixed;top:54px;left:50%;transform:translateX(-50%);',
        'z-index:9500;background:rgba(10,6,25,0.88);backdrop-filter:blur(12px);',
        'border:1px solid rgba(255,200,140,0.3);border-radius:20px;',
        'padding:5px 16px;font-family:"Cormorant Garamond",serif;',
        'font-size:0.72rem;letter-spacing:1.5px;pointer-events:none;',
        'transition:opacity 0.6s ease;opacity:0;'
      ].join('');
      document.body.appendChild(RT._statusEl);
    }
    RT._statusEl.textContent = msg;
    RT._statusEl.style.color  = ok ? 'rgba(120,255,160,0.9)' : 'rgba(255,200,120,0.85)';
    RT._statusEl.style.borderColor = ok ? 'rgba(120,255,160,0.3)' : 'rgba(255,200,120,0.3)';
    RT._statusEl.style.opacity = '1';
    if(ok) setTimeout(function(){ if(RT._statusEl) RT._statusEl.style.opacity='0'; }, 2800);
  },

  // Main subscribe — uses SDK if available, raw WS as fallback
  connect: function(table, callback){
    // Prefer SDK-based subscription (proper Supabase v2 channel API)
    setTimeout(function(){
      var sdk = getSupaSDK();
      if(sdk && typeof sdk.channel === 'function'){
        RT._connectViaSDK(sdk, table, callback);
      } else {
        // SDK not ready — retry once after 1.5s, then fall back to raw WS
        setTimeout(function(){
          var sdk2 = getSupaSDK();
          if(sdk2 && typeof sdk2.channel === 'function'){
            RT._connectViaSDK(sdk2, table, callback);
          } else {
            console.warn('[Garden RT] SDK unavailable for', table, '— using raw WS fallback');
            RT._connectViaWS(table, callback);
          }
        }, 1500);
      }
    }, 1000); // 1s delay per spec — lets SDK finish handshake
  },

  // SDK path: proper channel().on('postgres_changes').subscribe()
  _connectViaSDK: function(sdk, table, callback){
    // Remove existing channel for this table if any
    if(RT._channels[table]){
      try{ sdk.removeChannel(RT._channels[table]); }catch(_){}
    }

    var channelName = 'garden-' + table + '-' + Date.now();
    var ch = sdk
      .channel(channelName)
      .on('postgres_changes',
        { event: '*', schema: 'public', table: table },
        function(payload){
          var ev  = payload.eventType; // INSERT | UPDATE | DELETE
          var rec = payload.new || payload.old;
          if(ev && rec) callback(ev, rec);
        }
      )
      .on('system', {}, function(status){
        if(status === 'SUBSCRIBED'){
          console.log('[Garden RT] Realtime Subscribed:', table);
          RT._showStatus('Syncing live ✦', true);
        } else if(status === 'TIMED_OUT' || status === 'CLOSED'){
          console.warn('[Garden RT] Channel', status, 'for', table, '— reconnecting…');
          RT._showStatus('Reconnecting…', false);
          setTimeout(function(){ RT._connectViaSDK(sdk, table, callback); }, 4000);
        } else if(status === 'CHANNEL_ERROR'){
          console.warn('[Garden RT] Channel error for', table);
        }
      })
      .subscribe(function(status, err){
        if(err) console.warn('[Garden RT] Subscribe error:', err);
        if(status === 'SUBSCRIBED'){
          console.log('[Garden RT] Realtime Subscribed ✓', table);
          RT._showStatus('Syncing live ✦', true);
        }
      });

    RT._channels[table] = ch;
  },

  // Raw WebSocket fallback (Phoenix protocol v2)
  _connectViaWS: function(table, callback){
    var wsBase = SUPA_URL.replace('https://','wss://').replace('http://','ws://');
    var wsUrl  = wsBase + '/realtime/v1/websocket?apikey=' + SUPA_KEY + '&vsn=1.0.0';
    var ws, hb, retryTimer;

    function cleanup(){ clearInterval(hb); clearTimeout(retryTimer); try{ws&&ws.close();}catch(_){} }
    function retry(){ cleanup(); retryTimer=setTimeout(connect, 5000); }

    function connect(){
      try{
        ws = new WebSocket(wsUrl);

        ws.onopen = function(){
          var joinMsg = JSON.stringify({
            topic: 'realtime:public:' + table,
            event: 'phx_join',
            payload: { config: { postgres_changes: [{ event: '*', schema: 'public', table: table }] } },
            ref: '1'
          });
          ws.send(joinMsg);
          hb = setInterval(function(){
            if(ws && ws.readyState === 1){
              ws.send(JSON.stringify({topic:'phoenix',event:'heartbeat',payload:{},ref:'hb'}));
            }
          }, 20000);
        };

        ws.onmessage = function(e){
          try{
            var msg = JSON.parse(e.data);
            // v1 protocol: event name in msg.event; data in msg.payload
            if(msg.event === 'phx_reply' && msg.payload && msg.payload.status === 'ok'){
              console.log('[Garden RT-WS] Raw WS joined:', table);
              RT._showStatus('Syncing ✦', true);
            }
            if(msg.event === 'INSERT' || msg.event === 'UPDATE' || msg.event === 'DELETE'){
              var rec = msg.payload && msg.payload.record;
              if(rec) callback(msg.event, rec);
            }
            // v2 postgres_changes wrapped in postgres_changes event
            if(msg.event === 'postgres_changes' && msg.payload && msg.payload.data){
              var d = msg.payload.data;
              callback(d.type, d.record || d.old_record);
            }
          }catch(_){}
        };

        ws.onerror = function(err){ console.warn('[Garden RT-WS] Error:', err); };
        ws.onclose = function(code){ console.warn('[Garden RT-WS] Closed:', code, '— retrying'); retry(); };

      } catch(err){
        console.warn('[Garden RT-WS] Could not open WebSocket:', err);
        retry();
      }
    }
    connect();
  }
};

// SUPABASE INIT — Memories + Diary
// ─────────────────────────────────────────────────────────────
function initSupabase(){
  console.log('[Garden] initSupabase called — user:', Session.user && Session.user.name);
  // Show loading badge
  _showDBStatus('Connecting\u2026', false);

  // Main init wrapped in try-catch so garden never goes blank
  setTimeout(function(){
    try{
      loadMemories();
    }catch(err){ console.warn('[Garden] loadMemories error:', err); }

    try{
      loadDiary();
    }catch(err){ console.warn('[Garden] loadDiary error:', err); }

    try{
      startRealtime();
    }catch(err){ console.warn('[Garden] startRealtime error:', err); startPolling(); }
  }, 800);
}

function _showDBStatus(msg, ok){
  var el = document.getElementById('dbStatusBadge');
  if(!el) return;
  el.textContent = msg;
  el.style.color       = ok ? 'rgba(120,255,160,0.9)' : 'rgba(255,210,100,0.8)';
  el.style.borderColor = ok ? 'rgba(120,255,160,0.3)' : 'rgba(255,210,100,0.3)';
  el.style.opacity = '1';
  if(ok) setTimeout(function(){ el.style.opacity='0'; }, 3000);
}

function startRealtime(){
  var sdk = getSupaSDK();
  if(!sdk){
    console.warn('[Garden] SDK not available — falling back to polling');
    startPolling(); return;
  }
  setTimeout(function(){
    _subscribeTable(sdk, 'memories', function(ev, rec){
      if(ev==='INSERT' && rec) addMemoryCard(rec);
    });
    _subscribeTable(sdk, 'diary', function(ev, rec){
      if(ev==='INSERT' && rec) prependDiaryEntry(rec);
      if(ev==='DELETE' && rec && rec.id) { var el=document.getElementById('diary-'+rec.id); if(el) el.remove(); }
    });
  }, 1000);
}

function _subscribeTable(sdk, table, callback){
  try{
    var ch = sdk.channel('garden-'+table)
      .on('postgres_changes',
        { event: '*', schema: 'public', table: table },
        function(payload){
          try{
            var ev  = payload.eventType;
            var rec = payload.new || payload.old;
            if(ev && rec) callback(ev, rec);
          }catch(e){ console.warn('[Garden] RT payload error:', e); }
        }
      )
      .on('system', {}, function(status){
        console.log('[Garden] RT ['+table+'] status:', status);
        if(status === 'SUBSCRIBED'){
          console.log('[Garden] Realtime Subscribed \u2713', table);
          _showDBStatus('Syncing live \u2726', true);
          clearInterval(window._pollTimer);
        }
        if(status === 'TIMED_OUT' || status === 'CLOSED' || status === 'CHANNEL_ERROR'){
          console.warn('[Garden] RT '+status+' on '+table+' \u2014 polling fallback');
          _showDBStatus('Polling\u2026', false);
          startPolling();
        }
      })
      .subscribe(function(status, err){
        if(err) console.warn('[Garden] subscribe err:', err);
        if(status === 'SUBSCRIBED'){
          console.log('[Garden] Realtime Subscribed \u2713', table);
          _showDBStatus('Syncing live \u2726', true);
        }
      });
  }catch(e){
    console.warn('[Garden] _subscribeTable threw:', e);
    startPolling();
  }
}

// Polling fallback — every 30s if realtime fails
var _pollTimer = null;
function startPolling(){
  if(_pollTimer) return; // already running
  console.log('[Garden] Starting 30s polling fallback');
  _pollTimer = setInterval(function(){
    try{ loadMemories(); }catch(e){}
    try{ loadDiary();    }catch(e){}
  }, 30000);
}


// Run immediately if already authenticated — wrapped for safety
(function(){
  function _tryInit(){
    if(typeof Session === 'undefined' || typeof initSupabase === 'undefined'){
      setTimeout(_tryInit, 120); return;
    }
    if(Session.load()){
      console.log('[Garden] AUTH SUCCESS ✔ — restoring session for:', Session.user && Session.user.name);
      try{ initSupabase(); }catch(e){ console.error('[Garden] initSupabase threw:', e); }
    } else {
      console.log('[Garden] No session — Gatekeeper will handle auth');
    }
  }
  // Run after window.onload to guarantee CDN scripts are fully parsed
  if(document.readyState === 'complete'){
    setTimeout(_tryInit, 0);
  } else {
    window.addEventListener('load', function(){ setTimeout(_tryInit, 0); });
  }
})();

var memoriesContainer;
function loadMemories(){
  memoriesContainer=document.getElementById('memoriesGrid');
  DB.select('memories').then(function(rows){
    if(!Array.isArray(rows)) return;
    rows.forEach(addMemoryCard);

function addMemoryCard(row){
  if(!memoriesContainer) return;
  var existing=document.getElementById('mem-'+row.id);
  if(existing) return;
  var card=document.createElement('div');
  card.id='mem-'+row.id;
  card.className='mem-card';
  card.style.cssText='background:rgba(255,255,255,0.04);border:1px solid rgba(255,200,140,0.18);border-radius:10px;overflow:hidden;animation:memSlide 0.5s ease both;cursor:pointer;';
  card.innerHTML='<img src="'+row.url+'" style="width:100%;height:130px;object-fit:cover;object-position:center top;display:block;" loading="lazy" />'
    +'<div style="padding:8px 10px;">'
    +'<div style="font-family:\'Pinyon Script\',cursive;font-size:0.85rem;color:rgba(255,220,180,0.88);">'+(row.description||'A moment')+'</div>'
    +'<div style="font-family:\'Cormorant Garamond\',serif;font-size:0.62rem;color:rgba(200,180,255,0.55);margin-top:2px;font-style:italic;">'+(row.date?new Date(row.date).toLocaleDateString():'')+'<span style="float:right;opacity:0.6;">'+(row.added_by||'')+'</span></div>'
    +'</div>';
  // Long press → edit
  var lpTimer;
  card.addEventListener('touchstart',function(){lpTimer=setTimeout(function(){openMemEdit(row,card);},700);},{passive:true});
  card.addEventListener('touchend',function(){clearTimeout(lpTimer);},{passive:true});
  card.addEventListener('mousedown',function(){lpTimer=setTimeout(function(){openMemEdit(row,card);},700);});
  card.addEventListener('mouseup',function(){clearTimeout(lpTimer);});
  memoriesContainer.insertBefore(card, memoriesContainer.firstChild);

  document.getElementById('diarySave').addEventListener('click',function(){
    var title=document.getElementById('diaryTitle').value.trim();
    var content=document.getElementById('diaryContent').value.trim();
    var date=document.getElementById('diaryDate').value||new Date().toISOString().slice(0,10);
    if(!title&&!content){document.getElementById('diaryContent').focus();return;}
    document.getElementById('diarySave').disabled=true;
    DB.insert('diary',{title:title||'Untitled',content:content,date:date}).then(function(rows){
      document.getElementById('diaryTitle').value='';
      document.getElementById('diaryContent').value='';
      if(rows&&rows[0]) prependDiaryEntry(rows[0]);
      if(navigator.vibrate) navigator.vibrate([20,15,40]);
    }).catch(function(){alert('Could not save. Check connection.');})
    .finally(function(){document.getElementById('diarySave').disabled=false;});
  });

  function loadDiary2(){
    DB.select('diary').then(function(rows){
      if(!Array.isArray(rows)) return;
      rows.forEach(prependDiaryEntry);
    }).catch(function(){});
  }
  window.loadDiary = loadDiary2;

  // Diary toggle button
  var dBtn=document.createElement('button');
  dBtn.id='diaryToggle';
  dBtn.textContent='📓';
  dBtn.title='Secret Diary';
  dBtn.style.cssText='position:fixed;bottom:140px;right:14px;z-index:600;background:rgba(0,0,0,0.35);border:1px solid rgba(255,200,140,0.3);border-radius:50%;width:36px;height:36px;font-size:1rem;cursor:pointer;backdrop-filter:blur(8px);color:#fff;display:flex;align-items:center;justify-content:center;transition:transform 0.15s;';
  dBtn.addEventListener('click',function(){
    if(!Session.user){alert('Please authenticate first.');return;}
    diaryOpen=!diaryOpen;
    panel.style.display='flex';
    requestAnimationFrame(function(){panel.style.opacity=diaryOpen?'1':'0';});
    if(!diaryOpen) setTimeout(function(){panel.style.display='none';},400);
    if(navigator.vibrate) navigator.vibrate(25);
  });
  dBtn.addEventListener('touchstart',function(e){e.stopPropagation();},{passive:true});
  document.body.appendChild(dBtn);
})();

window.prependDiaryEntry=function(row){
  var list=document.getElementById('diaryList'); if(!list) return;
  if(document.getElementById('diary-'+row.id)) return;
  var card=document.createElement('div');
  card.id='diary-'+row.id;
  card.style.cssText='background:rgba(255,255,255,0.03);border:1px solid rgba(255,200,140,0.14);border-radius:10px;padding:12px 14px;margin-bottom:12px;animation:memSlide 0.4s ease both;';
  card.innerHTML='<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;">'
    +'<div style="font-family:\'Pinyon Script\',cursive;font-size:1rem;color:rgba(255,220,160,0.88);">'+row.title+'</div>'
    +'<div style="font-size:0.6rem;color:rgba(200,180,255,0.45);font-style:italic;white-space:nowrap;margin-left:8px;">'+new Date(row.date).toLocaleDateString()+'</div>'
    +'</div>'
    +'<div style="font-size:0.82rem;color:rgba(255,230,200,0.72);line-height:1.55;white-space:pre-wrap;">'+row.content+'</div>'
    +'<button class="diary-del-btn" data-id="'+row.id+'" style="margin-top:8px;background:none;border:none;color:rgba(255,100,100,0.45);font-size:0.65rem;cursor:pointer;font-family:\'Cormorant Garamond\',serif;letter-spacing:0.5px;">✕ delete</button>';
  list.insertBefore(card, list.firstChild);
  card.querySelector('.diary-del-btn').addEventListener('click',function(){
    if(!confirm('Delete this entry?')) return;
    DB.del('diary',row.id).then(function(){card.remove();}).catch(function(){alert('Delete failed.');});
  });
};

// ─────────────────────────────────────────────────────────────
// MEMORIES GRID in world space (inject HTML element)
// ─────────────────────────────────────────────────────────────
(function buildMemoriesSection(){
  var world=document.getElementById('world');
  if(!world) return;
  var W=world.offsetWidth||1400;
  var sec=document.createElement('div');
  sec.style.cssText='position:absolute;bottom:12%;left:5%;width:90%;z-index:25;';
  sec.innerHTML='<div style="font-family:\'Pinyon Script\',cursive;font-size:1.1rem;color:rgba(255,220,160,0.65);letter-spacing:2px;text-align:center;margin-bottom:10px;text-shadow:0 0 20px rgba(255,180,100,0.4);">Our Memories</div>'
    +'<div id="memoriesGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;max-height:260px;overflow-y:auto;padding:4px;"></div>';
  world.appendChild(sec);
  document.head.insertAdjacentHTML('beforeend','<style>@keyframes memSlide{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}#memoriesGrid::-webkit-scrollbar{width:3px}#memoriesGrid::-webkit-scrollbar-thumb{background:rgba(255,200,140,0.25);border-radius:2px}</style>');
})();
