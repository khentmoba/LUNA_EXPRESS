<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Eternal Sanctuary ✦ Khent & Clair Jassen</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Pinyon+Script&display=swap"
    rel="stylesheet">

  <!-- SEO & PWA -->
  <meta name="theme-color" content="#1a0a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Eternal Sanctuary">
  <meta name="description"
    content="A private digital sanctuary for Khent & Clair Jassen. A place of procedural growth and shared memories.">
  <meta property="og:title" content="Eternal Sanctuary">
  <meta property="og:description" content="A private digital garden for Khent & Clair Jassen">
</head>

<body>
  <!-- Status Badge for DB connectivity -->
  <div id="dbStatusBadge"></div>

  <!-- Hint Overlay -->
  <div id="hint">✦ tap • swipe • drag photos • rain comes and goes ✦</div>

  <!-- Perspective Viewport -->
  <div id="viewport">
    <div id="world">
      <!-- Main Background Canvas (Garden) -->
      <canvas id="bgCanvas"></canvas>

      <!-- Interactive World Elements -->
      <div class="moon" id="moon"></div>

      <div class="card">
        <div class="name">Clair Jassen</div>
        <div class="divider"></div>
        <div class="message">May your days bloom as gently as these flowers,<br>and your heart always find its way home
          to joy.</div>
        <div class="hearts">♡ ♡ ♡</div>
      </div>

      <div id="pinnedNote">
        <div class="note-inner">
          <div class="note-pin"></div>
          <div class="note-glow"></div>
          <div class="note-text">Loved this spot!</div>
          <div class="note-author">— Khent 🌿</div>
          <div class="note-stone">🪨</div>
        </div>
      </div>

      <!-- Photo Gallery (Initial Frames) -->
      <div class="photo-gallery" id="photoGallery">
        <div class="photo-frame" style="--rot:-6deg; --tx:-206px; --delay:1.5s; z-index:31;">
          <div class="photo-inner">
            <img src="/assets/gallery-1.jpg" alt="Memory 1">
            <div class="photo-caption">Together</div>
          </div>
          <div class="photo-shadow"></div>
        </div>
        <div class="photo-frame" style="--rot:4deg; --tx:192px; --delay:1.8s; z-index:32;">
          <div class="photo-inner">
            <img src="/assets/gallery-2.jpg" alt="Memory 2">
            <div class="photo-caption">Adventures</div>
          </div>
          <div class="photo-shadow"></div>
        </div>
        <div class="photo-frame" style="--rot:-2deg; --tx:-15px; --delay:2.1s; z-index:33;">
          <div class="photo-inner">
            <img src="/assets/gallery-3.jpg" alt="Memory 3">
            <div class="photo-caption">Sanctuary</div>
          </div>
          <div class="photo-shadow"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- UI Overlay Layer -->
  <div id="timeDisplay">Dawn</div>
  <div id="weatherIndicator">☀️ Clear</div>
  <div id="minimap"><canvas id="minimapCanvas" width="124" height="80"></canvas></div>
  <div id="fogOverlay"></div>

  <!-- App Entry Point -->
  <script type="module" src="/src/main.js"></script>
</body>

</html>
