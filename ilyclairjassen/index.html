<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none;background:#0c1e04;}
#viewport{position:fixed;inset:0;overflow:hidden;}
#world{position:absolute;width:260vw;height:215vh;left:0;top:0;will-change:transform;transition:background 5s ease;}
#bgCanvas{position:absolute;top:0;left:0;pointer-events:none;width:100%;height:100%;}
#fxCanvas{position:fixed;top:0;left:0;pointer-events:none;width:100%;height:100%;z-index:9000;}
#hint{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:rgba(255,240,210,.1);backdrop-filter:blur(12px);color:rgba(255,235,210,.9);font-family:'Cormorant Garamond',serif;font-style:italic;font-size:.82rem;padding:5px 18px;border-radius:20px;pointer-events:none;z-index:300;animation:hintFade 5s ease 3.5s forwards;letter-spacing:1.2px;border:1px solid rgba(255,220,180,.18);}
@keyframes hintFade{0%{opacity:1}65%{opacity:1}100%{opacity:0}}
#minimap{position:fixed;bottom:14px;right:14px;z-index:500;border-radius:10px;overflow:hidden;box-shadow:0 6px 28px rgba(0,0,0,.65),0 0 0 1px rgba(255,200,140,.22);}
#minimapCanvas{display:block;}
#timeDisplay{position:fixed;bottom:14px;left:14px;z-index:500;font-family:'Pinyon Script',cursive;font-size:1.1rem;pointer-events:none;letter-spacing:1px;transition:color .8s;}
#weatherIndicator{position:fixed;top:14px;right:14px;z-index:500;font-family:'Cormorant Garamond',serif;font-size:.72rem;color:rgba(200,220,255,.75);background:rgba(0,10,30,.5);backdrop-filter:blur(8px);padding:4px 10px;border-radius:12px;border:1px solid rgba(100,150,255,.2);pointer-events:none;letter-spacing:.8px;transition:opacity .5s;}
.moon{position:absolute;top:5%;right:9%;width:68px;height:68px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff9e6,#fde68a,#f59e0b);box-shadow:0 0 38px 13px rgba(251,220,100,.32),0 0 88px 32px rgba(251,220,100,.1);animation:moonGlow 5s ease-in-out infinite alternate;cursor:pointer;z-index:12;}
@keyframes moonGlow{from{box-shadow:0 0 38px 13px rgba(251,220,100,.32),0 0 88px 32px rgba(251,220,100,.1);}to{box-shadow:0 0 58px 22px rgba(251,220,100,.52),0 0 125px 52px rgba(251,220,100,.18);}}
.card{position:absolute;top:3.5%;left:50%;transform:translateX(-50%);text-align:center;z-index:20;animation:fadeDown 2.2s ease forwards;opacity:0;white-space:nowrap;}
@keyframes fadeDown{from{opacity:0;transform:translateX(-50%) translateY(-18px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.name{font-family:'Pinyon Script',cursive;font-size:clamp(2.8rem,5.2vw,4.6rem);color:#fff6ee;text-shadow:0 0 24px rgba(255,195,140,.85),2px 2px 4px rgba(0,0,0,.45);line-height:1;letter-spacing:2px;}
.divider{margin:7px auto;width:190px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,215,175,.78),transparent);}
.message{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(.78rem,1.75vw,1rem);color:rgba(255,238,215,.88);letter-spacing:1px;max-width:310px;margin:0 auto;line-height:1.62;white-space:normal;}
.hearts{margin-top:5px;font-size:.95rem;color:#ffb3c6;letter-spacing:6px;}
.photo-gallery{position:absolute;bottom:.8%;left:50%;transform:translateX(-50%);width:100%;z-index:30;pointer-events:none;}
.photo-frame{position:absolute;bottom:0;left:50%;transform:translateX(calc(-50% + var(--tx))) rotate(var(--rot));width:150px;cursor:grab;pointer-events:all;animation:photoFloat 1.1s cubic-bezier(.34,1.56,.64,1) forwards;opacity:0;animation-delay:var(--delay);box-shadow:0 12px 28px rgba(0,0,0,.52);user-select:none;-webkit-user-select:none;will-change:transform;}
.photo-frame:active{cursor:grabbing;}
.photo-frame.lifted{box-shadow:0 22px 48px rgba(0,0,0,.72);z-index:50!important;}
@keyframes photoFloat{from{opacity:0;transform:translateX(calc(-50% + var(--tx))) rotate(var(--rot)) translateY(38px);}to{opacity:1;transform:translateX(calc(-50% + var(--tx))) rotate(var(--rot)) translateY(0);}}
.photo-inner{background:white;padding:9px 9px 28px 9px;border-radius:2px;position:relative;overflow:hidden;}
.photo-inner img{width:100%;height:168px;object-fit:cover;object-position:center top;display:block;border-radius:1px;pointer-events:none;}
.photo-caption{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-family:'Pinyon Script',cursive;font-size:.78rem;color:#555;}
.photo-shadow{height:11px;background:radial-gradient(ellipse at center,rgba(0,0,0,.28) 0%,transparent 70%);margin-top:-3px;border-radius:50%;}
#pinnedNote{position:absolute;bottom:44%;left:36%;z-index:25;cursor:grab;user-select:none;-webkit-user-select:none;}
#pinnedNote:active{cursor:grabbing;}
.note-inner{padding:10px 13px 10px 12px;border-radius:5px;position:relative;transform:rotate(-2.2deg);min-width:126px;background:repeating-linear-gradient(0deg,transparent,transparent 22px,rgba(155,195,155,.15) 22px,rgba(155,195,155,.15) 23px),linear-gradient(135deg,#fefce8 0%,#fef9c3 35%,#fefce8 58%,#fef3c7 100%);box-shadow:0 5px 20px rgba(0,0,0,.36),0 0 24px rgba(100,255,120,.14),inset 0 1px 0 rgba(255,255,255,.7),inset 0 -1px 0 rgba(190,170,90,.18);border-left:3px solid rgba(72,170,82,.58);border-top:1px solid rgba(212,202,152,.52);}
.note-text{font-family:'Pinyon Script',cursive;font-size:.9rem;color:#243a1e;line-height:1.42;white-space:nowrap;}
.note-author{font-family:'Cormorant Garamond',serif;font-size:.62rem;color:#3a5a32;margin-top:4px;text-align:right;letter-spacing:1px;font-style:italic;}
.note-glow{position:absolute;inset:-8px;border-radius:12px;background:radial-gradient(ellipse,rgba(90,255,110,.11),transparent 70%);pointer-events:none;animation:noteGlow 3.5s ease-in-out infinite alternate;}
.note-pin{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:12px;height:12px;background:radial-gradient(circle at 38% 32%,#ffaaaa,#c02828);border-radius:50%;box-shadow:0 2px 5px rgba(0,0,0,.42);}
.note-stone{position:absolute;bottom:-18px;right:-8px;font-size:1rem;filter:drop-shadow(0 0 7px rgba(110,255,170,.8));animation:stonePulse 2.6s ease-in-out infinite alternate;}
@keyframes noteGlow{from{opacity:.5;}to{opacity:1;}}
@keyframes stonePulse{from{filter:drop-shadow(0 0 4px rgba(110,255,170,.5));}to{filter:drop-shadow(0 0 15px rgba(110,255,170,1));}}
</style>

// ═══════════════════════════════════════════════════════════
// REAL-WORLD TIME SYNC
// ═══════════════════════════════════════════════════════════
var RealTime = (function(){
  function getDayFraction(){
    var now = new Date();
    return (now.getHours()*3600 + now.getMinutes()*60 + now.getSeconds()) / 86400;
  }
  var t = getDayFraction();
  var cbs = [];
  setInterval(function(){ t = getDayFraction(); cbs.forEach(function(f){f(t);}); }, 10000);
  return { get: function(){ return t; }, onChange: function(f){ cbs.push(f); f(t); } };
})();

// ═══════════════════════════════════════════════════════════
// WEATHER STATE
// ═══════════════════════════════════════════════════════════
var Weather = (function(){
  var intensity = 0;      // 0=clear, 1=heavy rain
  var target = 0;
  var isRaining = false;
  var cbs = [];
  function cycle(){
    var delay = isRaining ? (8000 + Math.random()*12000) : (15000 + Math.random()*20000);
    setTimeout(function(){
      isRaining = !isRaining;
      target = isRaining ? 0.4 + Math.random()*0.5 : 0;
      cbs.forEach(function(f){f(isRaining, target);});
      cycle();
    }, delay);
  }
  cycle();
  setInterval(function(){ intensity += (target - intensity) * 0.04; }, 50);
  return {
    getIntensity: function(){ return intensity; },
    isRaining: function(){ return isRaining; },
    onChange: function(f){ cbs.push(f); }
  };
})();

// ═══════════════════════════════════════════════════════════
// SONIC VISUALIZER (Web Audio API)
// ═══════════════════════════════════════════════════════════
var SonicViz = (function(){
  var ctx2 = null, analyser = null, dataArr = null, source = null;
  var fallback = []; // fallback waveform if no audio
  for(var i=0;i<32;i++) fallback.push(0.05 + Math.random()*0.15);
  var phase = 0;

  function init(){
    try {
      ctx2 = new (window.AudioContext || window.webkitAudioContext)();
      analyser = ctx2.createAnalyser();
      analyser.fftSize = 64;
      dataArr = new Uint8Array(analyser.frequencyBinCount);
      // Ambient oscillators
      for(var h=0;h<4;h++){
        var osc = ctx2.createOscillator();
        var gain = ctx2.createGain();
        osc.type = h%2===0?'sine':'triangle';
        osc.frequency.value = [220, 330, 440, 528][h];
        gain.gain.value = 0.012;
        osc.connect(gain); gain.connect(analyser);
        analyser.connect(ctx2.destination);
        osc.start();
      }
    } catch(e){}
  }

  return {
    init: init,
    getFreqs: function(){
      phase += 0.04;
      if(analyser && dataArr){
        analyser.getByteFrequencyData(dataArr);
        var out = [];
        for(var i=0;i<dataArr.length;i++) out.push(dataArr[i]/255);
        return out;
      }
      // Animated fallback
      var out = [];
      for(var i=0;i<32;i++) out.push(0.08 + 0.12*Math.sin(phase*1.3+i*.4) + 0.05*Math.cos(phase*2.1+i*.8));
      return out;
    },
    isActive: function(){ return !!ctx2; }
  };
})();

// First user interaction → init audio
document.addEventListener('touchstart', function initAudio(){
  SonicViz.init();
  document.removeEventListener('touchstart', initAudio);
  document.removeEventListener('click', initAudio);
}, {once:true});
document.addEventListener('click', function initAudio(){
  SonicViz.init();
  document.removeEventListener('touchstart', initAudio);
  document.removeEventListener('click', initAudio);
}, {once:true});

// ═══════════════════════════════════════════════════════════
// DNA GROWTH PANEL
// ═══════════════════════════════════════════════════════════
var DNAPanel = (function(){
  var curvature = 0.5, stemH = 0.6, petalCount = 5, petalSpread = 0.7;
  var targets = { curvature:0.5, stemH:0.6, petalCount:5, petalSpread:0.7 };
  var phase = 0, morphT = 0;

  setInterval(function(){
    targets.curvature = 0.2 + Math.random()*0.75;
    targets.stemH = 0.3 + Math.random()*0.65;
    targets.petalCount = 3 + Math.floor(Math.random()*7);
    targets.petalSpread = 0.3 + Math.random()*0.7;
    morphT = 0;
  }, 4000);

  setInterval(function(){
    morphT = Math.min(1, morphT + 0.018);
    var e = morphT < 0.5 ? 2*morphT*morphT : -1+(4-2*morphT)*morphT;
    curvature += (targets.curvature - curvature) * 0.05 * (1+e);
    stemH += (targets.stemH - stemH) * 0.05 * (1+e);
    petalCount += (targets.petalCount - petalCount) * 0.04;
    petalSpread += (targets.petalSpread - petalSpread) * 0.05;
    phase += 0.025;
  }, 16);

  return {
    get: function(){ return { curvature:curvature, stemH:stemH, petalCount:petalCount, petalSpread:petalSpread, phase:phase }; }
  };
})();

// ═══════════════════════════════════════════════════════════
// DIGITAL POLLEN (heat-map data)
// ═══════════════════════════════════════════════════════════
var Pollen = (function(){
  var points = [];
  // Seed with "drifted from other sessions"
  for(var i=0;i<60;i++){
    points.push({
      x: Math.random(), y: 0.45 + Math.random()*0.35,
      heat: 0.3 + Math.random()*0.7,
      age: Math.random()
    });
  }
  setInterval(function(){
    // Add new pollen occasionally
    if(points.length < 80 && Math.random() < 0.3){
      points.push({x:Math.random(), y:0.5+Math.random()*0.3, heat:0.8+Math.random()*0.2, age:0});
    }
    points.forEach(function(p){ p.age += 0.001; p.x += (Math.random()-0.5)*0.002; });
    points = points.filter(function(p){ return p.age < 1; });
  }, 100);
  return { getPoints: function(){ return points; } };
})();

// ═══════════════════════════════════════════════════════════
// MAIN BG CANVAS
// ═══════════════════════════════════════════════════════════
(function(){
  var bc = document.getElementById('bgCanvas');
  var world = document.getElementById('world');
  var W = world.offsetWidth, H = world.offsetHeight;
  bc.width = W; bc.height = H;
  var ctx = bc.getContext('2d');

  function lerpC(a,b,t){return[a[0]+(b[0]-a[0])*t|0,a[1]+(b[1]-a[1])*t|0,a[2]+(b[2]-a[2])*t|0];}
  function rgb(c){return'rgb('+c[0]+','+c[1]+','+c[2]+')';}

  function getSky(t){
    if(t<.22){var p=t/.22;return{top:lerpC([8,4,22],[255,160,110],p),bot:lerpC([18,10,40],[255,210,170],p),starA:1-p*.8,sun:null,moon:{x:.76,y:.14+p*.06}};}
    if(t<.36){var p=(t-.22)/.14;return{top:lerpC([255,160,110],[255,178,128],p),bot:lerpC([255,210,170],[255,222,182],p),starA:.2-p*.2,sun:{x:.08+p*.22,y:.7-p*.48},moon:null};}
    if(t<.64){var p=(t-.36)/.28;return{top:lerpC([255,178,128],[255,168,118],p),bot:lerpC([255,222,182],[255,212,172],p),starA:0,sun:{x:.3+p*.28,y:.22-.04*p},moon:null};}
    if(t<.78){var p=(t-.64)/.14;return{top:lerpC([255,168,118],[45,28,75],p),bot:lerpC([255,212,172],[255,100,65],p),starA:p*.7,sun:{x:.58+p*.22,y:.18+p*.52},moon:null};}
    var p=(t-.78)/.22;return{top:lerpC([45,28,75],[8,4,22],p),bot:lerpC([255,100,65],[18,10,40],p),starA:.7+p*.3,sun:null,moon:{x:.76,y:.32-p*.18}};
  }

  // Stars
  var stars=[];for(var i=0;i<260;i++)stars.push({x:Math.random()*W,y:Math.random()*H*.55,r:Math.random()*1.8+.28,ph:Math.random()*6.28,sp:Math.random()*.022+.007});

  // Rain drops
  var rainDrops=[];for(var i=0;i<320;i++)rainDrops.push({x:Math.random()*W*1.2,y:Math.random()*H,vy:8+Math.random()*12,vx:-1.5-Math.random()*2,len:8+Math.random()*22,alive:true});

  // Fireflies
  var flies=[];

  // ── Draw flower functions ──
  function drawLily(ctx, x,y,h,sz,col,col2,sway,stage,t3){
    ctx.save(); ctx.translate(x,y);
    var cx=Math.sin(sway*.035)*h*.42+Math.sin(sway*.015)*h*.12;
    ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(cx*.25,-h*.28,cx*.6,-h*.6,cx,-h);
    ctx.strokeStyle='#3d7a22';ctx.lineWidth=3*sz;ctx.lineCap='round';ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx*.15,-h*.12);ctx.bezierCurveTo(cx*.3,-h*.35,cx*.5,-h*.55,cx*.85,-h*.88);
    ctx.strokeStyle='rgba(120,200,60,.2)';ctx.lineWidth=1*sz;ctx.stroke();
    for(var li=0;li<2;li++){
      var lp=.3+li*.3,lx=cx*lp,lly=-h*lp;
      ctx.save();ctx.translate(lx,lly);ctx.rotate(li===0?-.4:.35);
      ctx.beginPath();ctx.ellipse(li===0?-10*sz:9*sz,0,16*sz,5.5*sz,li===0?-.15:.15,0,6.28);
      var lg=ctx.createLinearGradient(-16*sz,0,12*sz,0);lg.addColorStop(0,'#3a7018');lg.addColorStop(.5,'#6aba30');lg.addColorStop(1,'#3a7018');ctx.fillStyle=lg;ctx.fill();
      var dg=ctx.createRadialGradient(li===0?-8*sz:8*sz,-2*sz,0,li===0?-8*sz:8*sz,-2*sz,2.2*sz);
      dg.addColorStop(0,'rgba(255,255,255,.9)');dg.addColorStop(.4,'rgba(200,240,255,.6)');dg.addColorStop(1,'rgba(150,200,255,0)');
      ctx.beginPath();ctx.ellipse(li===0?-8*sz:8*sz,-2*sz,2.2*sz,1.8*sz,-.3,0,6.28);ctx.fillStyle=dg;ctx.fill();
      ctx.restore();
    }
    var px=cx,py=-h,openness=stage;
    var petSz=(14+openness*8)*sz,petH=(28+openness*14)*sz;
    if(stage<.2){
      ctx.beginPath();ctx.ellipse(px,py,5*sz,12*sz,0,0,6.28);
      var bg=ctx.createLinearGradient(px,py+12*sz,px,py-12*sz);bg.addColorStop(0,col2);bg.addColorStop(1,col);ctx.fillStyle=bg;ctx.fill();
    } else {
      for(var p=0;p<6;p++){
        var pa=(Math.PI/3)*p+t3*.006;
        ctx.save();ctx.translate(px,py);ctx.rotate(pa);
        var pg=ctx.createLinearGradient(0,0,0,-petH);pg.addColorStop(0,col2);pg.addColorStop(.45,col);pg.addColorStop(1,'rgba(255,255,255,.75)');
        ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(-petSz*.55,-petH*.28,-petSz*.65,-petH*.72,0,-petH);ctx.bezierCurveTo(petSz*.65,-petH*.72,petSz*.55,-petH*.28,0,0);
        ctx.fillStyle=pg;ctx.fill();
        ctx.strokeStyle='rgba(255,255,255,.15)';ctx.lineWidth=.6;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-petH*.8);ctx.stroke();
        ctx.restore();
      }
      ctx.beginPath();ctx.arc(px,py,6*sz,0,6.28);var cg=ctx.createRadialGradient(px,py-1,0,px,py,6*sz);cg.addColorStop(0,'#fff9c4');cg.addColorStop(.5,'#fde68a');cg.addColorStop(1,'#f59e0b');ctx.fillStyle=cg;ctx.fill();
    }
    ctx.restore();
  }

  function drawRose(ctx,x,y,h,sz,col,col2,sway,stage,t3){
    ctx.save();ctx.translate(x,y);
    var cx=Math.sin(sway*.035)*h*.38;
    ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(cx*.2,-h*.25,cx*.55,-h*.58,cx,-h);ctx.strokeStyle='#3d7a22';ctx.lineWidth=3*sz;ctx.stroke();
    ctx.save();ctx.translate(cx*.5,-h*.42);ctx.beginPath();ctx.ellipse(-8*sz,0,15*sz,5.5*sz,-.25,0,6.28);ctx.fillStyle='#4a8a22';ctx.fill();ctx.restore();
    var rx=cx,ry=-h;
    var layers=[[3,9*sz,col],[5,14*sz,col2],[8,20*sz,col]];
    for(var li=layers.length-1;li>=0;li--){
      if(li>0&&stage<.35)continue;
      var l=layers[li];
      for(var p=0;p<l[0];p++){
        var pa=(Math.PI*2/l[0])*p+t3*.035+li*.35;
        ctx.save();ctx.translate(rx+Math.cos(pa)*l[1]*.28,ry+Math.sin(pa)*l[1]*.28);ctx.rotate(pa+Math.PI*.5);
        var rg=ctx.createLinearGradient(0,-l[1],0,0);rg.addColorStop(0,'rgba(255,255,255,.5)');rg.addColorStop(.35,l[2]);rg.addColorStop(1,col2);
        ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(-l[1]*.5,-l[1]*.42,-l[1]*.42,-l[1]*.88,0,-l[1]);ctx.bezierCurveTo(l[1]*.42,-l[1]*.88,l[1]*.5,-l[1]*.42,0,0);
        ctx.fillStyle=rg;ctx.globalAlpha=.88;ctx.fill();ctx.globalAlpha=1;ctx.restore();
      }
    }
    ctx.beginPath();ctx.arc(rx,ry,5*sz,0,6.28);ctx.fillStyle='#fde68a';ctx.fill();
    ctx.restore();
  }

  function drawGenericFlower(ctx,x,y,h,sz,col,col2,sway,stage,t3,type){
    ctx.save();ctx.translate(x,y);
    var cx=Math.sin(sway*.03)*h*.3;
    ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(cx*.3,-h*.42,cx*.65,-h*.62,cx,-h);ctx.strokeStyle='#4a8a22';ctx.lineWidth=2.5*sz;ctx.stroke();
    var dx=cx,dy=-h;
    if(type==='lavender'){
      for(var b=0;b<7;b++){var bx=dx+Math.sin(b*.75+t3*.04)*4*sz,by2=dy+b*(h*.09);ctx.beginPath();ctx.ellipse(bx-4*sz,by2,5*sz,3.5*sz,-.28,0,6.28);ctx.fillStyle=col;ctx.fill();ctx.beginPath();ctx.ellipse(bx+4*sz,by2,5*sz,3.5*sz,.28,0,6.28);ctx.fillStyle=col2;ctx.fill();}
    } else if(type==='daisy'){
      var n=10+Math.floor(sz*4);for(var p=0;p<n;p++){var pa=(Math.PI*2/n)*p+t3*.02;ctx.save();ctx.translate(dx,dy);ctx.rotate(pa);ctx.beginPath();ctx.ellipse(0,-12*sz,3.5*sz,9*sz,0,0,6.28);ctx.fillStyle=col;ctx.fill();ctx.restore();}
      ctx.beginPath();ctx.arc(dx,dy,8*sz,0,6.28);ctx.fillStyle='#fde68a';ctx.fill();
    } else if(type==='tulip'){
      for(var p=0;p<3;p++){var pa=p*(Math.PI*2/3)+t3*.015;ctx.save();ctx.translate(dx,dy);ctx.rotate(pa);ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(-9*sz,-8*sz,-11*sz,-26*sz,0,-32*sz);ctx.bezierCurveTo(11*sz,-26*sz,9*sz,-8*sz,0,0);ctx.fillStyle=col;ctx.fill();ctx.restore();}
    } else {
      var n2=18;for(var p=0;p<n2;p++){var pa=(Math.PI*2/n2)*p+t3*.006;ctx.save();ctx.translate(dx,dy);ctx.rotate(pa);ctx.beginPath();ctx.ellipse(0,-15*sz,4*sz,11*sz,0,0,6.28);ctx.fillStyle=p%2===0?col:col2;ctx.fill();ctx.restore();}
      ctx.beginPath();ctx.arc(dx,dy,10*sz,0,6.28);ctx.fillStyle='#451a03';ctx.fill();
    }
    ctx.restore();
  }

  // ── DNA wireframe panel ──
  function drawDNAPanel(ctx, x, y, w, h2, t3){
    ctx.save();
    // panel bg
    var bg=ctx.createLinearGradient(x,y,x,y+h2);
    bg.addColorStop(0,'rgba(0,15,30,.88)');bg.addColorStop(1,'rgba(0,25,45,.92)');
    ctx.fillStyle=bg;ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h2,10):ctx.rect(x,y,w,h2);ctx.fill();
    ctx.strokeStyle='rgba(0,200,255,.35)';ctx.lineWidth=1;ctx.stroke();
    // grid lines
    ctx.save();ctx.globalAlpha=.08;
    for(var gx=x+20;gx<x+w;gx+=20){ctx.beginPath();ctx.moveTo(gx,y);ctx.lineTo(gx,y+h2);ctx.strokeStyle='rgba(0,200,255,1)';ctx.lineWidth=.5;ctx.stroke();}
    for(var gy=y+20;gy<y+h2;gy+=20){ctx.beginPath();ctx.moveTo(x,gy);ctx.lineTo(x+w,gy);ctx.stroke();}
    ctx.globalAlpha=1;ctx.restore();
    // title
    ctx.fillStyle='rgba(0,220,255,.9)';ctx.font='bold 9px monospace';ctx.textAlign='left';ctx.fillText('DNA-GROWTH',x+8,y+14);
    // sliders
    var dna=DNAPanel.get();
    var sliders=[
      {label:'CURVATURE',val:dna.curvature},
      {label:'STEM H',val:dna.stemH},
      {label:'PETALS',val:dna.petalCount/10},
      {label:'SPREAD',val:dna.petalSpread}
    ];
    sliders.forEach(function(sl,i){
      var sy2=y+26+i*16;
      ctx.fillStyle='rgba(0,200,255,.55)';ctx.font='6px monospace';ctx.fillText(sl.label,x+8,sy2+5);
      ctx.fillStyle='rgba(0,40,60,.7)';ctx.fillRect(x+55,sy2,w-65,7);
      var gc=ctx.createLinearGradient(x+55,sy2,x+55+(w-65)*sl.val,sy2);
      gc.addColorStop(0,'rgba(0,255,200,.3)');gc.addColorStop(1,'rgba(0,255,200,.9)');
      ctx.fillStyle=gc;ctx.fillRect(x+55,sy2,(w-65)*sl.val,7);
      ctx.strokeStyle='rgba(0,200,255,.3)';ctx.lineWidth=.5;ctx.strokeRect(x+55,sy2,w-65,7);
    });
    // Wireframe procedural flower
    var fcx=x+w/2,fcy=y+h2-65,fh=38*dna.stemH;
    // stem
    ctx.beginPath();ctx.moveTo(fcx,fcy);var scx=Math.sin(dna.phase*.3)*12*dna.curvature;
    ctx.bezierCurveTo(fcx+scx*.3,fcy-fh*.35,fcx+scx*.6,fcy-fh*.65,fcx+scx,fcy-fh);
    ctx.strokeStyle='rgba(0,255,150,.6)';ctx.lineWidth=1.5;ctx.setLineDash([3,3]);ctx.stroke();ctx.setLineDash([]);
    // petals
    var n=Math.round(dna.petalCount);
    for(var p=0;p<n;p++){
      var pa=(Math.PI*2/n)*p+dna.phase*.04;
      var pr=14*dna.petalSpread,ph2=22*dna.petalSpread;
      ctx.save();ctx.translate(fcx+scx,fcy-fh);ctx.rotate(pa);
      ctx.beginPath();ctx.moveTo(0,0);
      ctx.bezierCurveTo(-pr*dna.curvature*.6,-ph2*.3,-pr*dna.curvature*.65,-ph2*.72,0,-ph2);
      ctx.bezierCurveTo(pr*dna.curvature*.65,-ph2*.72,pr*dna.curvature*.6,-ph2*.3,0,0);
      ctx.strokeStyle='rgba(0,200,255,'+(0.4+p/n*.4)+')';ctx.lineWidth=.8;
      ctx.setLineDash([2,2]);ctx.stroke();ctx.setLineDash([]);ctx.restore();
    }
    // center dot
    ctx.beginPath();ctx.arc(fcx+scx,fcy-fh,4,0,6.28);
    ctx.fillStyle='rgba(0,255,200,.8)';ctx.fill();
    // scan line
    var scanY=y+22+(((dna.phase*.02)%1)*(h2-30));
    ctx.fillStyle='rgba(0,200,255,.06)';ctx.fillRect(x,scanY,w,2);
    ctx.restore();
  }

  var frame=0;
  function draw(){
    frame++;
    ctx.clearRect(0,0,W,H);
    var dayT=RealTime.get();
    var sky=getSky(dayT);
    var rainI=Weather.getIntensity();

    // ── SKY ──
    var sg=ctx.createLinearGradient(0,0,0,H*.6);
    sg.addColorStop(0,rgb(sky.top));sg.addColorStop(1,rgb(sky.bot));
    ctx.fillStyle=sg;ctx.fillRect(0,0,W,H*.6);

    // Rain atmospheric tint
    if(rainI>0.05){
      ctx.fillStyle='rgba(100,120,160,'+(rainI*.28)+')';ctx.fillRect(0,0,W,H);
    }

    // Sun
    if(sky.sun){
      var sunX=sky.sun.x*W,sunY=sky.sun.y*H*.58;
      var sunG=ctx.createRadialGradient(sunX,sunY,0,sunX,sunY,110);
      sunG.addColorStop(0,'rgba(255,250,205,1)');sunG.addColorStop(.14,'rgba(255,230,130,.92)');sunG.addColorStop(.4,'rgba(255,190,80,.45)');sunG.addColorStop(1,'rgba(255,150,0,0)');
      ctx.beginPath();ctx.arc(sunX,sunY,110,0,6.28);ctx.fillStyle=sunG;ctx.fill();
      ctx.beginPath();ctx.arc(sunX,sunY,18,0,6.28);ctx.fillStyle='rgba(255,255,230,.98)';ctx.fill();
    }
    if(sky.moon){
      var mx=sky.moon.x*W,my=sky.moon.y*H*.58;
      ctx.beginPath();ctx.arc(mx,my,26,0,6.28);ctx.fillStyle='rgba(240,235,200,.94)';ctx.fill();
      ctx.beginPath();ctx.arc(mx+10,my-5,22,0,6.28);ctx.fillStyle=rgb(sky.top);ctx.fill();
    }
    var sa=Math.max(0,sky.starA);
    for(var i=0;i<stars.length;i++){var s=stars[i];var a=sa*(0.28+0.72*(0.5+0.5*Math.sin(s.ph+frame*s.sp)));if(a<.02)continue;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.28);ctx.fillStyle='rgba(255,255,255,'+a+')';ctx.fill();}

    // ── HILLS ──
    var hillBaseY=H*.58;
    var hillCols=[['rgba(180,150,180,.35)','rgba(200,170,190,.2)'],['rgba(140,170,120,.52)','rgba(160,190,130,.32)'],['rgba(90,130,60,.72)','rgba(110,150,70,.48)']];
    for(var hl=0;hl<3;hl++){
      var hscale=1-hl*.15,hy=hillBaseY+(hl*H*.024);
      ctx.save();ctx.filter='blur('+(3-hl*1.2)+'px)';
      ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(0,hy);
      for(var hx=0;hx<=W;hx+=W/20){var hamp=(24+hl*14)*hscale;ctx.lineTo(hx,hy-Math.sin(hx*.0035+hl*2.1)*hamp-Math.sin(hx*.007+hl*1.3)*hamp*.5);}
      ctx.lineTo(W,H);ctx.closePath();
      var hg2=ctx.createLinearGradient(0,hy-55,0,hy+28);hg2.addColorStop(0,hillCols[hl][0]);hg2.addColorStop(1,hillCols[hl][1]);ctx.fillStyle=hg2;ctx.fill();ctx.restore();
    }

    // ── GROUND ──
    var gy=H*.62;
    ctx.save();ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(W,H);ctx.lineTo(W,gy+H*.033);
    ctx.bezierCurveTo(W*.72,gy-H*.017,W*.28,gy-H*.017,0,gy+H*.033);ctx.closePath();
    var groundG=ctx.createLinearGradient(0,gy,0,H);
    groundG.addColorStop(0,'#3d6b22');groundG.addColorStop(.08,'#2d5a1b');groundG.addColorStop(.28,'#1e3e0e');groundG.addColorStop(.6,'#152b08');groundG.addColorStop(1,'#0c1e04');
    ctx.fillStyle=groundG;ctx.fill();ctx.restore();

    // Soil texture
    ctx.save();ctx.globalAlpha=.2;for(var i=0;i<35;i++){ctx.beginPath();ctx.ellipse(W*.03+i*(W*.028)+Math.sin(i*1.7)*W*.012,gy+H*.04+Math.sin(i*2.3)*H*.018,10+Math.sin(i)*7,3.5+Math.cos(i)*1.8,Math.sin(i*.5)*.6,0,6.28);ctx.fillStyle='#0a1804';ctx.fill();}ctx.globalAlpha=1;ctx.restore();

    // v2.0 etched text
    ctx.save();
    ctx.font='italic bold 11px "Cormorant Garamond",serif';
    ctx.textAlign='center';
    ctx.fillStyle='rgba(80,120,40,.0)';
    var textX=W*.5,textY=gy+H*.055;
    // emboss effect
    ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=0;ctx.shadowOffsetX=0;ctx.shadowOffsetY=1;
    ctx.fillStyle='rgba(30,55,15,.55)';ctx.fillText('v2.0: Generative Ecosystem',textX,textY);
    ctx.shadowColor='rgba(120,200,60,.3)';ctx.shadowBlur=3;
    ctx.fillStyle='rgba(90,140,40,.38)';ctx.fillText('v2.0: Generative Ecosystem',textX,textY);
    ctx.shadowBlur=0;ctx.shadowOffsetY=0;ctx.restore();

    // Pebbles
    for(var i=0;i<pebbles.length;i++){var pb=pebbles[i];var py2=gy+H*.055+Math.sin(i*1.4)*H*.022;ctx.beginPath();ctx.ellipse(pb.x,py2,pb.r,pb.r*.62,Math.sin(i)*.4,0,6.28);var pg2=ctx.createRadialGradient(pb.x-pb.r*.2,py2-pb.r*.2,0,pb.x,py2,pb.r);pg2.addColorStop(0,'rgba(255,255,255,.38)');pg2.addColorStop(.3,pb.col);pg2.addColorStop(1,'rgba(0,0,0,.5)');ctx.fillStyle=pg2;ctx.fill();}

    // Moss
    ctx.save();ctx.globalAlpha=.4;for(var i=0;i<16;i++){var mx2=(i*.064+.018)*W,my2=gy+H*.026+Math.sin(i*2.2)*H*.012;ctx.beginPath();ctx.ellipse(mx2,my2,17+Math.sin(i)*10,5+Math.cos(i)*2.5,.22,0,6.28);var mg2=ctx.createRadialGradient(mx2,my2,0,mx2,my2,17);mg2.addColorStop(0,'#6aca38');mg2.addColorStop(1,'#3a7018');ctx.fillStyle=mg2;ctx.fill();}ctx.globalAlpha=1;ctx.restore();

    // ── MEMORY CAPSULE GLOW ──
    capsulePulse = (capsulePulse + 0.018) % (Math.PI*2);
    var cpIntensity = 0.5 + 0.5*Math.sin(capsulePulse);
    for(var ring=3;ring>0;ring--){
      var cg3=ctx.createRadialGradient(capsuleX,capsuleY,0,capsuleX,capsuleY,40*ring*cpIntensity);
      cg3.addColorStop(0,'rgba(150,80,255,'+(0.18*cpIntensity/ring)+')');
      cg3.addColorStop(.4,'rgba(100,50,200,'+(0.1*cpIntensity/ring)+')');
      cg3.addColorStop(1,'rgba(80,30,180,0)');
      ctx.beginPath();ctx.arc(capsuleX,capsuleY,40*ring*cpIntensity,0,6.28);ctx.fillStyle=cg3;ctx.fill();
    }
    // Capsule shimmer line
    ctx.beginPath();ctx.ellipse(capsuleX,capsuleY,35,8,.1,0,6.28);
    ctx.strokeStyle='rgba(180,100,255,'+(0.3+cpIntensity*.4)+')';ctx.lineWidth=1.5;
    ctx.setLineDash([4,6]);ctx.stroke();ctx.setLineDash([]);

    // Grass
    for(var i=0;i<grass.length;i++){
      var b=grass[i];var bY=gy+H*.028+Math.sin(i*1.2)*H*.015;
      var rainSway=rainI*Math.sin(frame*.04+i*.3)*15;
      var sw=Math.sin(frame*b.sp+b.ph)*9+rainSway;
      ctx.beginPath();ctx.moveTo(b.x,bY);ctx.bezierCurveTo(b.x+sw*.3,bY-b.h*.38,b.x+sw*.7,bY-b.h*.7,b.x+sw,bY-b.h);
      ctx.strokeStyle=b.col;ctx.lineWidth=b.w;ctx.lineCap='round';ctx.stroke();
    }

    // ── FLOWERS ──
    var lilyBloomSrc = 0;
    for(var i=0;i<flies.length;i++){if(flies[i].cluster){var d=Math.hypot(flies[i].x-W*.5,flies[i].y-(groundY-65));if(d<200)lilyBloomSrc+=Math.max(0,1-d/200);}}
    window._lilyBloom = Math.min(1,(window._lilyBloom||0)*.97+lilyBloomSrc*.01);

    var sorted=flowerDefs.slice().sort(function(a,b){return a.baseY-b.baseY;});
    var t3=frame;
    for(var i=0;i<sorted.length;i++){
      var fl=sorted[i];
      var rainW=rainI*(Math.sin(frame*.038+fl.swayPh*1.2)*14);
      fl.rainLean = fl.rainLean*.9 + rainW*.1;
      var sway=Math.sin(frame*fl.swaySpd+fl.swayPh)*(fl.side==='left'?4:fl.side==='right'?-4:2.5)+fl.rainLean;
      var totalAngle=(fl.baseAngle+sway+fl.lean)*Math.PI/180;
      fl.lean*=fl.leanDecay;
      var bloom=fl.isCluster?window._lilyBloom:0;
      var stage=Math.min(1,fl.stage+bloom*.5);
      ctx.save();ctx.translate(fl.x,fl.baseY);ctx.rotate(totalAngle);ctx.translate(-fl.x,-fl.baseY);
      if(fl.type==='lily')drawLily(ctx,fl.x,fl.baseY,fl.h,fl.sz,fl.pc,fl.pc2,sway,stage,t3);
      else if(fl.type==='rose')drawRose(ctx,fl.x,fl.baseY,fl.h,fl.sz,fl.pc,fl.pc2,sway,stage,t3);
      else drawGenericFlower(ctx,fl.x,fl.baseY,fl.h,fl.sz,fl.pc,fl.pc2,sway,stage,t3,fl.type);
      ctx.restore();
    }

    // ── SONIC WAVES from flowers ──
    var freqs=SonicViz.getFreqs();
    if(frame%18===0){
      var srcFlowers=flowerDefs.filter(function(f){return f.type==='lily'&&f.isCluster;});
      if(srcFlowers.length>0){
        var sf=srcFlowers[Math.floor(Math.random()*srcFlowers.length)];
        var sw2=sonicWaves.find(function(w){return!w.alive;})||sonicWaves[frame%MAX_SONIC];
        sw2.alive=true;sw2.x=sf.x;sw2.y=sf.baseY-sf.h;sw2.r=0;sw2.life=1;sw2.ml=1.2;sw2.freq=freqs[Math.floor(Math.random()*freqs.length)];
      }
    }
    for(var i=0;i<sonicWaves.length;i++){
      var sw3=sonicWaves[i];if(!sw3.alive)continue;
      sw3.life-=0.008/sw3.ml;if(sw3.life<=0){sw3.alive=false;continue;}
      sw3.r+=1.5+sw3.freq*2;
      ctx.beginPath();ctx.arc(sw3.x,sw3.y,sw3.r,0,6.28);
      ctx.strokeStyle='rgba('+(180+sw3.freq*75|0)+','+(120+sw3.freq*80|0)+','+(255|0)+','+(sw3.life*(0.12+sw3.freq*.12))+')';
      ctx.lineWidth=1+sw3.freq;ctx.stroke();
    }

    // Dew drops
    for(var i=0;i<dew.length;i++){var d=dew[i];var pulse=.7+.3*Math.sin(frame*d.sp+d.ph);var dg2=ctx.createRadialGradient(d.x-.4,d.y-1,0,d.x,d.y,d.r*pulse);dg2.addColorStop(0,'rgba(255,255,255,.9)');dg2.addColorStop(.35,'rgba(200,240,255,.6)');dg2.addColorStop(1,'rgba(140,200,240,0)');ctx.beginPath();ctx.ellipse(d.x,d.y,d.r*pulse,d.r*pulse*.8,-.3,0,6.28);ctx.fillStyle=dg2;ctx.fill();}

    // Petals
    for(var i=0;i<petals.length;i++){var p=petals[i];p.wob+=.022;p.x+=p.vx+Math.sin(p.wob)*.3+rainI*-2;p.y+=p.vy+rainI*3;p.rot+=p.rv+rainI*.05;if(p.y>H+30||p.x<-50){p.y=-30;p.x=Math.random()*W;}ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.beginPath();ctx.ellipse(0,0,p.sz,p.sz*1.65,0,0,6.28);ctx.fillStyle=p.col;ctx.globalAlpha=.48+rainI*.15;ctx.fill();ctx.restore();ctx.globalAlpha=1;}

    // ── RAIN ──
    if(rainI>0.02){
      ctx.save();ctx.globalAlpha=rainI*.6;
      for(var i=0;i<Math.floor(rainI*280);i++){
        var rd=rainDrops[i];
        rd.y+=rd.vy*(1+rainI);rd.x+=rd.vx;
        if(rd.y>H+20){rd.y=-20;rd.x=Math.random()*W*1.2;}
        ctx.beginPath();ctx.moveTo(rd.x,rd.y);ctx.lineTo(rd.x+rd.vx*rd.len*.08,rd.y+rd.len);
        ctx.strokeStyle='rgba(180,200,255,'+(0.4+rainI*.3)+')';ctx.lineWidth=.8;ctx.stroke();
        // splat on ground
        if(rd.y>gy&&rd.y<gy+H*.08){
          ctx.beginPath();ctx.ellipse(rd.x,gy+H*.04,3+Math.random()*4,1.5,0,0,6.28);
          ctx.strokeStyle='rgba(180,220,255,'+(0.25+rainI*.2)+')';ctx.lineWidth=.6;ctx.stroke();
        }
      }
      ctx.globalAlpha=1;ctx.restore();
    }

    // Foreground blur vignette
    var fgG=ctx.createLinearGradient(0,H*.82,0,H);fgG.addColorStop(0,'rgba(15,30,8,0)');fgG.addColorStop(.4,'rgba(12,24,6,.18)');fgG.addColorStop(1,'rgba(8,16,3,.52)');ctx.fillStyle=fgG;ctx.fillRect(0,H*.82,W,H*.18);

    // Foreground blurred grass
    ctx.save();ctx.filter='blur(3px)';ctx.globalAlpha=.48;
    for(var i=0;i<28;i++){var bx=(i/28)*W+Math.sin(i*1.7)*W*.02,bh=18+Math.random()*28,rainS2=rainI*Math.sin(frame*.038+i)*12;ctx.beginPath();ctx.moveTo(bx,H);ctx.quadraticCurveTo(bx+rainS2,H-bh*.55,bx+rainS2*1.4,H-bh);ctx.strokeStyle='#4a8a22';ctx.lineWidth=2.5;ctx.stroke();}
    ctx.globalAlpha=1;ctx.restore();

    // ── FIREFLIES ──
    var wpx=photoX-(window._panX||0),wpy=photoY-(window._panY||0);
    for(var i=0;i<flies.length;i++){
      var f=flies[i];
      f.ax=Math.sin(frame*f.sp*.72+f.ph)*.15+Math.cos(frame*f.sp*.38+f.ph*1.6)*.09;
      f.ay=Math.cos(frame*f.sp*.58+f.ph)*.1;
      if(f.cluster&&!photoDrag){var dx2=W*.5-f.x,dy2=(groundY-85)-f.y,dist2=Math.sqrt(dx2*dx2+dy2*dy2);if(dist2>0){var str2=Math.min(.8,120/dist2);f.ax+=dx2/dist2*str2;f.ay+=dy2/dist2*str2;}}
      if(photoDrag){var dx3=wpx-f.x,dy3=wpy-f.y,dist3=Math.sqrt(dx3*dx3+dy3*dy3);if(dist3<380&&dist3>0){var str3=Math.min(1.8,300/dist3);f.ax+=dx3/dist3*str3;f.ay+=dy3/dist3*str3;f.attracted=true;}}else{f.attracted=false;}
      // Rain scatters fireflies
      if(rainI>0.1){f.ax+=(Math.random()-.5)*rainI*.8;f.ay+=rainI*.3;}
      f.vx=(f.vx+f.ax)*.9;f.vy=(f.vy+f.ay)*.9;f.x+=f.vx;f.y+=f.vy;
      if(f.x<0)f.x=W;if(f.x>W)f.x=0;if(f.y<H*.18)f.y=H*.72;if(f.y>H*.9)f.y=H*.25;
      f.trailX.push(f.x);f.trailY.push(f.y);if(f.trailX.length>10){f.trailX.shift();f.trailY.shift();}
      for(var tt=1;tt<f.trailX.length;tt++){var ta=((tt/f.trailX.length)*.45)*(f.attracted?.9:f.cluster?.55:.35);ctx.beginPath();ctx.moveTo(f.trailX[tt-1],f.trailY[tt-1]);ctx.lineTo(f.trailX[tt],f.trailY[tt]);ctx.strokeStyle='rgba(255,253,140,'+ta+')';ctx.lineWidth=1.4;ctx.stroke();}
      var pulse=.5+.5*Math.sin(frame*f.sp*1.4+f.ph);
      var bR=f.r*(f.attracted?2.8:f.cluster?1.8:1.1)*(1+pulse*.45);
      var fa=f.attracted?.85+pulse*.1:f.cluster?(.4+pulse*.45):(.2+pulse*.3);
      fa*=(1-rainI*.4); // rain dims fireflies
      var bg=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,bR*4);bg.addColorStop(0,'rgba(255,253,110,'+fa*.65+')');bg.addColorStop(.25,'rgba(255,245,70,'+fa*.4+')');bg.addColorStop(.6,'rgba(200,220,40,'+fa*.15+')');bg.addColorStop(1,'rgba(255,253,150,0)');
      ctx.beginPath();ctx.arc(f.x,f.y,bR*4,0,6.28);ctx.fillStyle=bg;ctx.fill();
      ctx.beginPath();ctx.arc(f.x,f.y,bR*.55,0,6.28);ctx.fillStyle='rgba(255,255,220,'+Math.min(1,fa*1.2)+')';ctx.fill();
    }

    // ── DNA PANEL ──
    drawDNAPanel(ctx, W*.62, H*.1, 140, 165, frame);

    requestAnimationFrame(draw);
  }
  draw();

  // flower lean
  window.triggerFlowerLean=function(sx,sy,force){
    var wx=sx-(window._panX||0),wy=sy-(window._panY||0);
    for(var i=0;i<flowerDefs.length;i++){var fl=flowerDefs[i];var d=Math.hypot(fl.x-wx,fl.baseY-wy);if(d<240){var str=(force||1)*(1-d/240)*28;fl.lean+=wx<fl.x?str:-str;}}
  };

  // sky bg update
  RealTime.onChange(function(t){
    var s=getSky(t);
    document.getElementById('world').style.background='linear-gradient(180deg,'+rgb(s.top)+' 0%,'+rgb(s.bot)+' 52%,#2d5a1b 58%,#0c1e04 100%)';
    document.getElementById('timeDisplay').textContent=['Night','Night','Dawn','Morning','Morning','Noon','Afternoon','Afternoon','Dusk','Evening','Evening','Night'][Math.floor(t*12)%12];
  });
})();

  var waves=[];for(var i=0;i<14;i++)waves.push({alive:false,x:0,y:0,r:0,life:1,ml:.8});var wi=0;

  var tCols=['#ffb3c6','#ffd6e7','#c8b4fa','#b9f0e8','#fde68a','#a5f3fc','#fbcfe8'];var tcI=0;

  function spawnBurst(cx,cy,cnt){var p=getP();p.type='r';p.x=cx;p.y=cy;p.r=16;p.life=1;p.ml=.52;p.vx=0;p.vy=0;spawnSound(cx,cy);for(var i=0;i<cnt;i++){(function(idx){setTimeout(function(){var e=getE();var ang=(6.28/cnt)*idx+Math.random()*.35;var dist=48+Math.random()*58;e.x=cx;e.y=cy;e.vx=Math.cos(ang)*dist/15;e.vy=Math.sin(ang)*dist/15-2.1;e.life=1;e.ml=.82;e.el.textContent=eArr[Math.floor(Math.random()*eArr.length)];e.el.style.fontSize='1.3rem';e.el.style.color='';e.el.style.textShadow='';e.el.style.left=cx+'px';e.el.style.top=cy+'px';e.el.style.display='block';e.el.style.opacity='1';e.el.style.transform='translate(-50%,-50%) scale(1)';},idx*28);})(i);}}
  var DT=1/60;
  function loop(){ctx.clearRect(0,0,fc.width,fc.height);for(var i=0;i<14;i++){var w=waves[i];if(!w.alive)continue;w.life-=DT/w.ml;if(w.life<=0){w.alive=false;continue;}w.r+=2.1;ctx.beginPath();ctx.arc(w.x,w.y,w.r,0,6.28);ctx.strokeStyle='rgba(255,210,60,'+(w.life*.42)+')';ctx.lineWidth=1.8;ctx.stroke();}for(var i=0;i<MAX;i++){var p=pool[i];if(!p.alive)continue;p.life-=DT/p.ml;if(p.life<=0){p.alive=false;continue;}p.x+=p.vx;p.y+=p.vy;p.vy+=.032;if(p.type==='t'){ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,6.28);ctx.fillStyle=p.col;ctx.globalAlpha=p.life*.78;ctx.fill();ctx.globalAlpha=1;}else if(p.type==='r'){var prog=1-p.life;ctx.beginPath();ctx.arc(p.x,p.y,16+prog*80,0,6.28);ctx.strokeStyle='rgba(255,200,150,'+(p.life*.48)+')';ctx.lineWidth=1.8;ctx.stroke();}}for(var i=0;i<MEMAX;i++){var e=ep[i];if(!e.alive)continue;e.life-=DT/e.ml;if(e.life<=0){e.alive=false;e.el.style.display='none';continue;}e.x+=e.vx;e.y+=e.vy;e.vy+=.048;e.el.style.left=e.x+'px';e.el.style.top=e.y+'px';e.el.style.opacity=e.life;e.el.style.transform='translate(-50%,-50%) scale('+(0.35+e.life*.75)+')';}requestAnimationFrame(loop);}

// ═══════════════════════════════════════════════════════════
// MINIMAP with heatmap pollen
// ═══════════════════════════════════════════════════════════
(function(){
  var mc=document.getElementById('minimapCanvas');if(!mc)return;
  var ctx=mc.getContext('2d');var MW=mc.width,MH=mc.height;
  var typeColor={lily:'rgba(255,182,200,.9)',rose:'rgba(255,100,130,.9)',daisy:'rgba(255,248,140,.9)',lavender:'rgba(185,130,230,.9)',tulip:'rgba(255,145,100,.9)',sunflower:'rgba(255,210,50,.9)'};
  var typeIcon={lily:'\u273F',rose:'\u2740',daisy:'\u2741',lavender:'\u2022',tulip:'\u25B2',sunflower:'\u2739'};

  function heatColor(heat,alpha){
    var r=heat>0.5?(heat-.5)*2*255|0:0;
    var g=heat<0.5?heat*2*255|0:(1-(heat-.5)*2)*255|0;
    var b=heat<0.25?heat*4*255|0:0;
    return'rgba('+r+','+Math.max(80,g)+','+b+','+alpha+')';
  }

  function draw(px,py){
    var world=document.getElementById('world');var WW=world.offsetWidth,WH=world.offsetHeight;
    var vW=window.innerWidth,vH=window.innerHeight;
    ctx.clearRect(0,0,MW,MH);
    ctx.fillStyle='rgba(8,4,18,.94)';ctx.fillRect(0,0,MW,MH);
    var sg=ctx.createLinearGradient(0,0,0,MH*.56);
    var dt=RealTime.get();
    var warm=dt>.15&&dt<.82?'rgba(255,170,90,.28)':'rgba(30,10,60,.38)';
    sg.addColorStop(0,warm);sg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=sg;ctx.fillRect(0,0,MW,MH*.56);
    // hills
    ctx.save();ctx.globalAlpha=.32;for(var h=0;h<3;h++){ctx.beginPath();ctx.moveTo(0,MH*.53+h*2);for(var hx=0;hx<=MW;hx+=6)ctx.lineTo(hx,MH*.53+h*2-Math.sin(hx*.08+h*2.1)*4-Math.sin(hx*.04+h*1.3)*2);ctx.lineTo(MW,MH*.56);ctx.lineTo(0,MH*.56);ctx.closePath();ctx.fillStyle=['rgba(140,120,160,.48)','rgba(90,120,55,.58)','rgba(60,100,30,.68)'][h];ctx.fill();}ctx.globalAlpha=1;ctx.restore();
    // ground
    var gg=ctx.createLinearGradient(0,MH*.56,0,MH);gg.addColorStop(0,'rgba(45,90,25,.88)');gg.addColorStop(.3,'rgba(28,55,12,.9)');gg.addColorStop(1,'rgba(10,18,4,.95)');ctx.fillStyle=gg;ctx.fillRect(0,MH*.56,MW,MH*.44);
    // soil texture
    ctx.save();ctx.globalAlpha=.35;for(var i=0;i<4;i++){ctx.beginPath();ctx.ellipse((i*.25+.05)*MW,MH*.62,5,2,.1,0,6.28);ctx.fillStyle='#0a0802';ctx.fill();}ctx.globalAlpha=1;ctx.restore();

    // ── POLLEN HEAT MAP ──
    var pts=Pollen.getPoints();
    for(var i=0;i<pts.length;i++){
      var p=pts[i];
      var px2=p.x*MW,py2=p.y*MH;
      var fade=1-p.age;
      // heat glow
      var hg2=ctx.createRadialGradient(px2,py2,0,px2,py2,8);
      hg2.addColorStop(0,heatColor(p.heat,fade*.45));
      hg2.addColorStop(.5,heatColor(p.heat,fade*.2));
      hg2.addColorStop(1,heatColor(p.heat,0));
      ctx.beginPath();ctx.arc(px2,py2,8,0,6.28);ctx.fillStyle=hg2;ctx.fill();
      // dot
      ctx.beginPath();ctx.arc(px2,py2,1.5,0,6.28);ctx.fillStyle=heatColor(p.heat,fade*.9);ctx.fill();
    }

    // flower clusters
    var fds=window._flowerDefs||[];var clusterMap={};
    for(var i=0;i<fds.length;i++){var f=fds[i];var gk=Math.floor(f.x/WW*8)+','+f.type;if(!clusterMap[gk])clusterMap[gk]={x:0,y:0,n:0,type:f.type};clusterMap[gk].x+=f.x;clusterMap[gk].y+=f.baseY;clusterMap[gk].n++;}
    ctx.save();ctx.font='6px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    for(var k in clusterMap){var c=clusterMap[k];var mx2=(c.x/c.n/WW)*MW,my2=(c.y/c.n/WH)*MH;ctx.fillStyle=typeColor[c.type]||'rgba(200,200,200,.8)';ctx.fillText(typeIcon[c.type]||'\u2022',mx2,my2);}
    ctx.restore();

    // viewport rect
    var rx=(-px/WW)*MW,ry=(-py/WH)*MH,rw=(vW/WW)*MW,rh=(vH/WH)*MH;
    ctx.fillStyle='rgba(255,200,150,.07)';ctx.fillRect(rx,ry,rw,rh);ctx.strokeStyle='rgba(255,215,160,.92)';ctx.lineWidth=1.5;ctx.strokeRect(rx,ry,rw,rh);
    // note
    var ne=document.getElementById('pinnedNote');if(ne){var nl=parseInt(ne.style.left||0)||0,nt=parseInt(ne.style.top||0)||0;ctx.beginPath();ctx.arc((nl+60)/WW*MW,nt/WH*MH,3.2,0,6.28);ctx.fillStyle='rgba(100,255,130,.9)';ctx.fill();}
    // photos
    document.querySelectorAll('.photo-frame').forEach(function(fr){var r=fr.getBoundingClientRect();ctx.beginPath();ctx.arc((r.left-px)/WW*MW,(r.top-py)/WH*MH,2.8,0,6.28);ctx.fillStyle='rgba(255,165,210,.88)';ctx.fill();});

// ─────────────────────────────────────────────────────
// PATCH 1 & 2: Wind system + per-flower sway & dew seeds
// Extends each flowerDef with wind/dew properties
// ─────────────────────────────────────────────────────
(function patchFlowerDefs(){
  // Wait one tick so flowerDefs are fully built
  requestAnimationFrame(function(){
    var fds = window._flowerDefs;
    if(!fds) return;
    for(var i=0;i<fds.length;i++){
      var fl = fds[i];
      // Wind sway
      fl.windPhase  = Math.random()*6.28;
      fl.windSpeed  = 0.008 + Math.random()*0.006;   // 4-7s cycle
      fl.windAmp    = 3 + Math.random()*3;            // 3-6 deg
      fl.petalPh    = Math.random()*6.28;             // petal flutter
      fl.petalSpd   = 0.8 + Math.random()*0.4;       // 0.8-1.2s cycle
      // Dew drops (seeded per flower so consistent)
      fl.dewCount   = 3 + (i%3);                     // 3-5
      fl.dewSeeds   = [];
      for(var d=0;d<fl.dewCount;d++){
        fl.dewSeeds.push({
          pr: 0.15 + (((i*7+d*13)%17)/17)*0.55,     // petal radial 0-1
          pa: (d/fl.dewCount)*6.28 + i*0.4,          // petal angle
          r:  1.5 + ((i*3+d*5)%5)*0.4,              // 1.5-3.5px
          ph: Math.random()*6.28,
          sp: 0.003 + Math.random()*0.003            // 2-4s pulse
        });
      }
      // Depth layer: 0=bg(top), 1=mid, 2=fg(bottom)
      var yRatio = fl.baseY / (window._H||800);
      fl.depthLayer = yRatio > 0.72 ? 2 : yRatio > 0.52 ? 1 : 0;
    }
  });
})();

// ─────────────────────────────────────────────────────
// WIND PULSE — global modulator every 8-12s
// ─────────────────────────────────────────────────────
window.windIntensity = 1.0;
window.windTarget    = 1.0;
(function windPulseLoop(){
  var delay = 8000 + Math.random()*4000;
  setTimeout(function(){

    setTimeout(function(){

})();

// ─────────────────────────────────────────────────────
// DEW DROP DRAW HELPER
// Called with ctx already translated/rotated to flower
// ─────────────────────────────────────────────────────
window.drawDewDrops = function(ctx, fl, petSz, petH, rainI, frame){
  if(!fl.dewSeeds) return;
  var rain = rainI||0;
  for(var d=0;d<fl.dewSeeds.length;d++){
    var dw = fl.dewSeeds[d];
    var pulse = 0.6 + 0.4*(0.5+0.5*Math.sin(frame*dw.sp + dw.ph));
    var alpha = (0.55 + pulse*0.45) * (rain>0.1 ? 1 : 0.7);
    // Position on petal surface
    var px = Math.cos(dw.pa) * petSz * dw.pr;
    var py = -petH * (0.3 + dw.pr*0.5) + (rain>0.1 ? Math.sin(frame*0.08+dw.ph)*1.2 : 0);
    var r  = dw.r * (1 + rain*0.4);
    var dg = ctx.createRadialGradient(px-r*.3, py-r*.3, 0, px, py, r);
    dg.addColorStop(0,  'rgba(255,250,255,'+Math.min(1,alpha+0.15)+')');
    dg.addColorStop(0.4,'rgba(232,248,255,'+alpha+')');
    dg.addColorStop(1,  'rgba(180,230,255,0)');
    ctx.beginPath(); ctx.arc(px, py, r, 0, 6.28);
    ctx.fillStyle = dg; ctx.fill();
    // Highlight specular
    ctx.beginPath(); ctx.arc(px-r*.28, py-r*.28, r*.28, 0, 6.28);
    ctx.fillStyle = 'rgba(255,255,255,'+(alpha*.7)+')'; ctx.fill();
  }
};

// ─────────────────────────────────────────────────────
// PATCH 5: Pollen bioluminescence proximity check
// ─────────────────────────────────────────────────────
window.pollenGlowMap = {};  // flowerIndex → glow 0..1

window.checkPollenProximity = function(fds, pollenPts, W2, H2){
  if(!fds||!pollenPts) return;
  for(var i=0;i<fds.length;i++){
    var fl=fds[i];
    var glow=window.pollenGlowMap[i]||0;
    var hit=false;
    for(var p=0;p<pollenPts.length;p++){
      var pt=pollenPts[p];
      var px=pt.x*W2, py=pt.y*H2;
      var d=Math.hypot(fl.x-px, fl.baseY-py);
      if(d<60){ hit=true; break; }
    }
    glow = hit ? Math.min(1, glow+0.04) : Math.max(0, glow-0.02);
    window.pollenGlowMap[i] = glow;
  }
};

// ─────────────────────────────────────────────────────
// PATCH 6: Shadow gradient helper
// ─────────────────────────────────────────────────────
window._shadowAngle = 0;
window._shadowTarget = 0;
setInterval(function(){
  window._shadowTarget = Math.random()*Math.PI;  // sun arc
}, 18000);

window.getShadowGradient = function(ctx2, W2, H2){
  window._shadowAngle += (window._shadowTarget - window._shadowAngle)*0.001;
  var ang = window._shadowAngle;
  var cx = W2*(0.2 + 0.6*((ang/Math.PI)));
  var g = ctx2.createRadialGradient(cx, H2*0.3, 0, cx, H2*0.6, W2*0.55);
  g.addColorStop(0, 'rgba(255,240,200,0.06)');
  g.addColorStop(0.5,'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,0.04)');
  return g;
};

// ─────────────────────────────────────────────────────
// MASTER OVERLAY CANVAS — renders all v2 effects
// Separate from bgCanvas to avoid touching existing draw()
// ─────────────────────────────────────────────────────
(function(){
  // Create overlay canvas over bgCanvas in world space
  var world = document.getElementById('world');
  var ov = document.createElement('canvas');
  ov.id = 'v2Canvas';
  ov.style.cssText = 'position:absolute;top:0;left:0;pointer-events:none;width:100%;height:100%;z-index:5;';
  world.insertBefore(ov, world.firstChild.nextSibling);  // after bgCanvas

  // FX overlay canvas (fixed viewport coords, for ripples & freq waves on fxCanvas layer)
  var fxC2 = document.createElement('canvas');
  fxC2.id = 'v2FxCanvas';
  fxC2.style.cssText = 'position:fixed;top:0;left:0;pointer-events:none;width:100%;height:100%;z-index:9001;';
  document.body.appendChild(fxC2);

  function resize(){
    ov.width  = world.offsetWidth;
    ov.height = world.offsetHeight;
    fxC2.width  = window.innerWidth;
    fxC2.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  var ctx2  = ov.getContext('2d');
  var fxCtx = fxC2.getContext('2d');

  // Rain splatter tracking
  var lastRainSplat = 0;

  // Speaker flower index (center lily cluster, index ~32 in typical build)
  var speakerFlIdx = -1;

  var v2frame = 0;

  function v2Loop(){
    v2frame++;
    var W2 = ov.width, H2 = ov.height;
    var fW = fxC2.width, fH = fxC2.height;
    ctx2.clearRect(0,0,W2,H2);
    fxCtx.clearRect(0,0,fW,fH);

    var fds   = window._flowerDefs || [];
    var rainI = (typeof Weather !== 'undefined') ? Weather.getIntensity() : 0;
    var panX  = window._panX || 0;
    var panY  = window._panY || 0;
    var pollen= (typeof Pollen !== 'undefined') ? Pollen.getPoints() : [];

    // Wind intensity smooth update
    window.windIntensity += (window.windTarget - window.windIntensity) * 0.02;

    // ── 1. SHADOW GRADIENT OVERLAY ──
    var shadowG = window.getShadowGradient(ctx2, W2, H2);
    ctx2.fillStyle = shadowG;
    ctx2.fillRect(0, 0, W2, H2);

    // ── 2. POLLEN PROXIMITY CHECK ──
    window.checkPollenProximity(fds, pollen, W2, H2);

    // ── 3. PER-FLOWER: wind sway visual + dew drops + parallax + pollen glow ──
    for(var i=0;i<fds.length;i++){
      var fl = fds[i];
      if(!fl.windPhase && fl.windPhase !== 0) continue; // not patched yet

      // Update wind sway on flowerDef (feeds into existing draw() sway calculation)
      var wi = window.windIntensity;
      var windSway = Math.sin(v2frame * fl.windSpeed + fl.windPhase) * fl.windAmp * wi;
      fl._windExtra = windSway;  // existing draw() uses fl.lean — we inject via lean nudge
      fl.lean = (fl.lean||0) * 0.95 + windSway * 0.05; // soft blend, won't override user lean

      // Parallax depth: adjust scale & blur in world space
      var depth = fl.depthLayer; // 0=bg, 1=mid, 2=fg
      var depthScale = depth===2 ? 1.1 : depth===1 ? 1.0 : 0.85;
      var depthBlur  = depth===2 ? 0   : depth===1 ? 0   : 6;
      var depthAlpha = depth===2 ? 1.0 : depth===1 ? 1.0 : 0.65;

      // Pollen glow overlay
      var pg = window.pollenGlowMap[i]||0;
      if(pg > 0.05){
        var glowT = (v2frame*0.03) % (Math.PI*2);
        var gcyc  = (0.5+0.5*Math.sin(glowT));
        var gr,gg,gb;
        if(gcyc < 0.33){
          gr=0; gg=Math.floor(220*gcyc*3); gb=220;
        } else if(gcyc < 0.66){
          gr=Math.floor(220*(gcyc-0.33)*3); gg=0; gb=220;
        } else {
          gr=0; gg=Math.floor(220*(gcyc-0.66)*3); gb=0;
        }
        ctx2.save();
        ctx2.globalAlpha = pg * 0.35;
        var glowG = ctx2.createRadialGradient(fl.x, fl.baseY-fl.h*0.6, 0, fl.x, fl.baseY-fl.h*0.6, fl.h*0.5*depthScale);
        glowG.addColorStop(0, 'rgba('+gr+','+gg+','+gb+',0.7)');
        glowG.addColorStop(1, 'rgba('+gr+','+gg+','+gb+',0)');
        ctx2.beginPath(); ctx2.arc(fl.x, fl.baseY-fl.h*0.6, fl.h*0.5*depthScale, 0, 6.28);
        ctx2.fillStyle = glowG; ctx2.fill();
        ctx2.restore();
      }

      // Background flowers: blur + dim overlay
      if(depth === 0){
        ctx2.save();
        ctx2.globalAlpha = 0.32;
        ctx2.filter = 'blur(6px)';
        var bg2 = ctx2.createRadialGradient(fl.x, fl.baseY-fl.h*0.5, 0, fl.x, fl.baseY-fl.h*0.5, fl.h*0.55);
        bg2.addColorStop(0, 'rgba(80,50,30,0.28)');
        bg2.addColorStop(1, 'rgba(80,50,30,0)');
        ctx2.beginPath(); ctx2.arc(fl.x, fl.baseY-fl.h*0.5, fl.h*0.55, 0, 6.28);
        ctx2.fillStyle = bg2; ctx2.fill();
        ctx2.restore();
        ctx2.filter = 'none';
      }

      // Dew drops — drawn as tiny dots on petal areas
      if(fl.dewSeeds){
        var pSz = (14 + fl.sz*8) * fl.sz;
        var pH  = (28 + fl.sz*14) * fl.sz;
        ctx2.save();
        ctx2.translate(fl.x, fl.baseY - fl.h);
        window.drawDewDrops(ctx2, fl, pSz, pH, rainI, v2frame);
        ctx2.restore();
      }

      // Foreground flowers: subtle shadow beneath
      if(depth === 2){
        ctx2.save();
        ctx2.globalAlpha = 0.18;
        var sg2 = ctx2.createRadialGradient(fl.x, fl.baseY, 0, fl.x, fl.baseY, fl.sz*18);
        sg2.addColorStop(0, 'rgba(0,0,0,0.4)');
        sg2.addColorStop(1, 'rgba(0,0,0,0)');
        ctx2.beginPath(); ctx2.ellipse(fl.x, fl.baseY, fl.sz*18, fl.sz*5, 0, 0, 6.28);
        ctx2.fillStyle = sg2; ctx2.fill();
        ctx2.restore();
      }

      // Find speaker flower
      if(speakerFlIdx < 0 && fl.isCluster) speakerFlIdx = i;
    }

    // ── 4. FREQUENCY WAVES (auto-spawn every 6s) ──
    if(v2frame - window._lastFreqSpawn > 360 && speakerFlIdx >= 0){
      window._lastFreqSpawn = v2frame;
      var spk = fds[speakerFlIdx];
      if(spk){
        var spkScreenX = spk.x + panX;
        var spkScreenY = (spk.baseY - spk.h) + panY;
        window.spawnFrequencyWave(spk.x, spk.baseY - spk.h);
        window.spawnNoteFloat(spk.x, spk.baseY - spk.h);
      }
    }

    // Draw frequency waves on world canvas
    for(var i=0;i<window.freqWavePool.length;i++){
      var fw = window.freqWavePool[i];
      if(!fw.alive) continue;
      fw.life -= 1/(fw.ml*60);
      if(fw.life<=0){fw.alive=false;continue;}
      fw.r += (fw.maxR - 4) / (fw.ml*60);
      ctx2.beginPath(); ctx2.arc(fw.x, fw.y, fw.r, 0, 6.28);
      ctx2.strokeStyle = fw.color + (fw.life * 0.55 * (1/(fw.ring+1))) + ')';
      ctx2.lineWidth = 1.5 + fw.life;
      ctx2.stroke();
    }

    // Draw note floaters on world canvas
    ctx2.save();
    for(var i=0;i<window.noteFloaters.length;i++){
      var nf = window.noteFloaters[i];
      if(!nf.alive) continue;
      nf.life -= 1/(nf.ml*60);
      if(nf.life<=0){nf.alive=false;continue;}
      nf.x+=nf.vx; nf.y+=nf.vy; nf.rot+=nf.rotV;
      ctx2.save();
      ctx2.translate(nf.x, nf.y); ctx2.rotate(nf.rot);
      ctx2.globalAlpha = nf.life * 0.85;
      ctx2.fillStyle = 'rgba(255,220,80,'+(0.7+nf.life*0.3)+')';
      ctx2.font = 'bold '+(12+nf.life*4)+'px serif';
      ctx2.textAlign='center'; ctx2.textBaseline='middle';
      ctx2.shadowColor='rgba(255,180,0,0.6)'; ctx2.shadowBlur=6;
      ctx2.fillText(nf.char, 0, 0);
      ctx2.restore();
    }
    ctx2.restore();

    // ── 5. RAIN RIPPLES (on fx overlay) ──
    if(rainI > 0.05){
      var now5 = v2frame;
      // Spawn new ripples on soil surface
      var ripRate = Math.floor(rainI * 8);
      if(now5 % Math.max(1, 8-ripRate) === 0){
        var gy  = window._groundY || (fH*0.63);
        var rx2 = Math.random() * fW;
        // Convert world ground Y to screen
        var screenGY = gy + panY;
        if(screenGY > 0 && screenGY < fH){
          window.spawnRipple(rx2, screenGY + Math.random()*fH*0.08, rainI);
        }
      }
    }

    // Draw ripples on fx canvas (viewport space)
    for(var i=0;i<window.ripplePool.length;i++){
      var rp = window.ripplePool[i];
      if(!rp.alive) continue;
      rp.life -= 1/(rp.ml*60);
      if(rp.life<=0){rp.alive=false;continue;}
      rp.r += (rp.maxR-2)/(rp.ml*60);
      fxCtx.beginPath();
      fxCtx.arc(rp.x, rp.y, rp.r, 0, 6.28);
      fxCtx.strokeStyle = 'rgba(160,200,255,'+(rp.life*rp.alpha)+')';
      fxCtx.lineWidth = 1.2;
      fxCtx.stroke();
      // Inner ring
      if(rp.r>3){
        fxCtx.beginPath(); fxCtx.arc(rp.x, rp.y, rp.r*0.55, 0, 6.28);
        fxCtx.strokeStyle = 'rgba(200,230,255,'+(rp.life*rp.alpha*0.5)+')';
        fxCtx.lineWidth = 0.7; fxCtx.stroke();
      }
    }

    // ── 6. ATMOSPHERIC GRADIENT ENHANCEMENT ──
    // Warm-left / cool-right diagonal overlay
    var dayT = (typeof RealTime !== 'undefined') ? RealTime.get() : 0.3;
    var isDay = dayT > 0.18 && dayT < 0.78;
    if(isDay){
      var hg3 = ctx2.createLinearGradient(0, 0, W2, H2*0.6);
      hg3.addColorStop(0,   'rgba(255,200,100,0.04)');
      hg3.addColorStop(0.4, 'rgba(255,220,150,0.02)');
      hg3.addColorStop(1,   'rgba(80,60,120,0.04)');
      ctx2.fillStyle = hg3;
      ctx2.fillRect(0, 0, W2, H2*0.6);
    }

    requestAnimationFrame(v2Loop);
  }
  v2Loop();
})();

(function SeasonalTheme(){
  var m = new Date().getMonth(); // 0-11
  var seasons = {
    spring: { months:[2,3,4],  sky1:'#ffd6e7', sky2:'#c8f0c8', ground:'#3a8a28', accent:'#ff8fbd', accent2:'#a8e4a0', label:'Spring' },
    summer: { months:[5,6,7],  sky1:'#ffe4b5', sky2:'#87ceeb', ground:'#2d6e18', accent:'#ffd700', accent2:'#87ceeb', label:'Summer' },
    autumn: { months:[8,9,10], sky1:'#ff9966', sky2:'#cc4400', ground:'#6b3a1a', accent:'#ff6600', accent2:'#cc8800', label:'Autumn' },
    winter: { months:[11,0,1], sky1:'#b8d4e8', sky2:'#8aaabb', ground:'#1a2a3a', accent:'#e8f4f8', accent2:'#aaccdd', label:'Winter' }
  };
  var currentSeason = 'spring';
  for(var k in seasons){
    if(seasons[k].months.indexOf(m) >= 0){ currentSeason = k; break; }
  }
  var s = seasons[currentSeason];
  // Inject CSS variables
  var root = document.documentElement;
  root.style.setProperty('--season-sky1', s.sky1);
  root.style.setProperty('--season-sky2', s.sky2);
  root.style.setProperty('--season-ground', s.ground);
  root.style.setProperty('--season-accent', s.accent);
  root.style.setProperty('--season-accent2', s.accent2);

  // Season badge
  var badge = document.createElement('div');
  badge.id = 'seasonBadge';
  badge.textContent = s.label;
  badge.style.cssText = 'position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:600;font-family:"Pinyon Script",cursive;font-size:0.92rem;color:rgba(255,240,210,0.75);pointer-events:none;letter-spacing:2px;text-shadow:0 0 12px rgba(255,200,100,0.5);animation:seasonFadeIn 2s ease 1s forwards;opacity:0;';
  document.body.appendChild(badge);

  // Autumn: add falling leaves
  if(currentSeason === 'autumn'){
    window._seasonLeaves = true;
    var leafColors = ['#cc5500','#dd7700','#ee9900','#bb3300','#ffaa00'];
    window._leaves = [];
    for(var i=0;i<18;i++){
      window._leaves.push({
        x: Math.random()*window.innerWidth*3,
        y: -30 - Math.random()*800,
        vx: (Math.random()-0.5)*1.2,
        vy: 0.6 + Math.random()*1.2,
        rot: Math.random()*6.28,
        rv: (Math.random()-0.5)*0.06,
        sz: 6+Math.random()*8,
        col: leafColors[Math.floor(Math.random()*leafColors.length)],
        wob: Math.random()*6.28
      });
    }
  }
  // Winter: snow particles
  if(currentSeason === 'winter'){
    window._seasonSnow = true;
    window._snowflakes = [];
    for(var i=0;i<60;i++){
      window._snowflakes.push({
        x: Math.random()*(window._W||1400),
        y: -20 - Math.random()*600,
        vy: 0.3+Math.random()*0.7,
        vx: (Math.random()-0.5)*0.4,
        r: 1+Math.random()*3,
        alpha: 0.4+Math.random()*0.5,
        wob: Math.random()*6.28
      });
    }
  }
  window._currentSeason = currentSeason;
  window._seasonData = s;
})();

// ─────────────────────────────────────────────────────────────
// 2. AMBIENT SOUNDSCAPE (Synthesized via Web Audio)
// ─────────────────────────────────────────────────────────────
(function AmbientSound(){
  var audioCtx = null, nodes = {}, isPlaying = false;
  var currentMode = 'wind'; // 'wind' | 'rain' | 'off'

  function initAudio(){
    if(audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }

  function stopAll(){
    for(var k in nodes){
      try{ nodes[k].stop && nodes[k].stop(); nodes[k].disconnect(); }catch(e){}
    }
    nodes = {};
  }

  function playWind(){
    stopAll(); if(!audioCtx) return;
    // Brown noise via buffer
    var bufSize = audioCtx.sampleRate * 3;
    var buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    var data = buf.getChannelData(0);
    var last = 0;
    for(var i=0;i<bufSize;i++){
      var white = (Math.random()*2-1);
      data[i] = (last + 0.02*white)/1.02;
      last = data[i]; data[i] *= 3.5;
    }
    var src = audioCtx.createBufferSource();
    src.buffer = buf; src.loop = true;
    var lp = audioCtx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 320;
    var gain = audioCtx.createGain(); gain.gain.value = 0.0;
    src.connect(lp); lp.connect(gain); gain.connect(audioCtx.destination);
    src.start();
    gain.gain.linearRampToValueAtTime(0.12, audioCtx.currentTime+2);
    // LFO for wind gusts
    var lfo = audioCtx.createOscillator();
    var lfoGain = audioCtx.createGain(); lfoGain.gain.value = 0.07;
    lfo.frequency.value = 0.08; lfo.type = 'sine';
    lfo.connect(lfoGain); lfoGain.connect(gain.gain);
    lfo.start();
    nodes = {src:src, lp:lp, gain:gain, lfo:lfo, lfoGain:lfoGain};
  }

  function playRain(){
    stopAll(); if(!audioCtx) return;
    // White noise filtered for rain
    var bufSize = audioCtx.sampleRate * 2;
    var buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    var data = buf.getChannelData(0);
    for(var i=0;i<bufSize;i++) data[i] = Math.random()*2-1;
    var src = audioCtx.createBufferSource();
    src.buffer = buf; src.loop = true;
    var hp = audioCtx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=400;
    var lp2 = audioCtx.createBiquadFilter(); lp2.type='lowpass'; lp2.frequency.value=3000;
    var gain = audioCtx.createGain(); gain.gain.value=0;
    src.connect(hp); hp.connect(lp2); lp2.connect(gain); gain.connect(audioCtx.destination);
    src.start();
    gain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime+1.5);
    nodes = {src:src, hp:hp, lp2:lp2, gain:gain};
  }

  function toggle(){
    initAudio();
    if(currentMode === 'off'){
      currentMode = 'wind'; playWind();
      btn.textContent = '🌬'; btn.title = 'Sound: Wind';
    } else if(currentMode === 'wind'){
      currentMode = 'rain'; playRain();
      btn.textContent = '🌧'; btn.title = 'Sound: Rain';
    } else {
      currentMode = 'off'; stopAll();
      btn.textContent = '🔇'; btn.title = 'Sound: Off';
    }
    if(navigator.vibrate) navigator.vibrate(30);
  }

  // Auto-match weather
  if(typeof Weather !== 'undefined'){
    Weather.onChange(function(raining){
      if(raining && currentMode !== 'rain' && currentMode !== 'off'){
        currentMode = 'rain'; playRain();
        btn.textContent = '🌧';
      }
    });
  }

  // Sound toggle button
  var btn = document.createElement('button');
  btn.id = 'soundBtn';
  btn.textContent = '🔇';
  btn.title = 'Sound: Off';
  btn.style.cssText = 'position:fixed;top:14px;left:14px;z-index:600;background:rgba(0,0,0,0.35);border:1px solid rgba(255,200,140,0.3);border-radius:50%;width:36px;height:36px;font-size:1.1rem;cursor:pointer;backdrop-filter:blur(8px);color:#fff;line-height:1;display:flex;align-items:center;justify-content:center;transition:transform 0.15s,border-color 0.2s;';
  btn.addEventListener('click', toggle);
  btn.addEventListener('touchstart', function(e){e.stopPropagation();}, {passive:true});
  btn.addEventListener('mouseenter', function(){ btn.style.transform='scale(1.15)'; });
  btn.addEventListener('mouseleave', function(){ btn.style.transform='scale(1)'; });
  document.body.appendChild(btn);
  window._soundToggle = toggle;
})();

// ─────────────────────────────────────────────────────────────
// 4. INTERACTIVE FLORA — Tap to bloom + butterfly burst
// ─────────────────────────────────────────────────────────────
(function InteractiveFlora(){
  var butterflies = [];
  var MAX_BF = 30;
  for(var i=0;i<MAX_BF;i++) butterflies.push({alive:false,x:0,y:0,vx:0,vy:0,life:1,ml:1.8,col:'',wing:0,wsp:0});
  var bfIdx = 0;

  window.spawnButterflies = function(x, y, count){
    var cols = ['rgba(255,182,193','rgba(200,162,255','rgba(162,210,255','rgba(255,230,162','rgba(182,255,182'];
    for(var i=0;i<(count||6);i++){
      var b = butterflies[bfIdx%MAX_BF]; bfIdx++;
      b.alive=true;
      b.x=x; b.y=y;
      var ang = Math.random()*6.28;
      var spd = 1.5+Math.random()*2;
      b.vx=Math.cos(ang)*spd; b.vy=Math.sin(ang)*spd-1.5;
      b.life=1; b.ml=1.5+Math.random()*0.8;
      b.col=cols[Math.floor(Math.random()*cols.length)];
      b.wing=0; b.wsp=0.15+Math.random()*0.1;
    }
  };

  // Draw butterflies on v2Canvas each frame
  var origV2Loop = null;
  // We hook into the existing v2Loop via a shared ticker
  var bfCanvas = document.createElement('canvas');
  bfCanvas.id = 'bfCanvas';
  bfCanvas.style.cssText = 'position:fixed;top:0;left:0;pointer-events:none;width:100%;height:100%;z-index:9002;';
  bfCanvas.width  = window.innerWidth;
  bfCanvas.height = window.innerHeight;
  document.body.appendChild(bfCanvas);
  window.addEventListener('resize',function(){ bfCanvas.width=window.innerWidth; bfCanvas.height=window.innerHeight; });
  var bfCtx = bfCanvas.getContext('2d');

  function drawButterflies(){
    bfCtx.clearRect(0,0,bfCanvas.width,bfCanvas.height);
    for(var i=0;i<butterflies.length;i++){
      var b=butterflies[i]; if(!b.alive)continue;
      b.life-=1/(b.ml*60);
      if(b.life<=0){b.alive=false;continue;}
      b.x+=b.vx; b.y+=b.vy; b.vy+=0.03; b.wing+=b.wsp;
      var ws=Math.sin(b.wing)*12*b.life;
      bfCtx.save(); bfCtx.translate(b.x,b.y);
      bfCtx.globalAlpha=b.life*0.85;
      // Left wing
      bfCtx.save(); bfCtx.rotate(-Math.abs(ws)*0.05);
      bfCtx.beginPath(); bfCtx.ellipse(-ws*.5,0,Math.abs(ws)*.6,5*b.life,-.4,0,6.28);
      bfCtx.fillStyle=b.col+','+(b.life*0.8)+')'; bfCtx.fill();
      bfCtx.restore();
      // Right wing
      bfCtx.save(); bfCtx.rotate(Math.abs(ws)*0.05);
      bfCtx.beginPath(); bfCtx.ellipse(ws*.5,0,Math.abs(ws)*.6,5*b.life,.4,0,6.28);
      bfCtx.fillStyle=b.col+','+(b.life*0.8)+')'; bfCtx.fill();
      bfCtx.restore();
      // Body
      bfCtx.beginPath(); bfCtx.ellipse(0,0,2,5,0,0,6.28);
      bfCtx.fillStyle='rgba(50,30,10,'+(b.life*0.7)+')'; bfCtx.fill();
      bfCtx.restore();
    }
    requestAnimationFrame(drawButterflies);
  }
  drawButterflies();

  // Bloom + butterfly on world tap (canvas area)
  var lastBloom = 0;
  function handleBloomTap(cx, cy){
    var now = Date.now();
    if(now-lastBloom < 300) return;
    lastBloom = now;
    // Convert to world coords
    var wx=cx-(window._panX||0), wy=cy-(window._panY||0);
    // Check proximity to flowers
    var fds=window._flowerDefs||[];
    var nearest=null, nearDist=160;
    for(var i=0;i<fds.length;i++){
      var d=Math.hypot(fds[i].x-wx,fds[i].baseY-wy);
      if(d<nearDist){nearDist=d;nearest=fds[i];}
    }
    if(nearest){
      nearest.stage=Math.min(1,nearest.stage+0.3);
      window.spawnButterflies(cx, cy, 6);
      if(navigator.vibrate) navigator.vibrate(40);
    }
  }

  document.addEventListener('touchend',function(e){
    // Only trigger if not on photo or note
    var t=e.target;
    while(t){if(t.classList&&(t.classList.contains('photo-frame')||t.id==='pinnedNote'||t.id==='guestbookPanel'))return;t=t.parentElement;}
    if(e.changedTouches.length>0) handleBloomTap(e.changedTouches[0].clientX,e.changedTouches[0].clientY);
  },{passive:true});
  document.addEventListener('click',function(e){
    var t=e.target;
    while(t){if(t.classList&&(t.classList.contains('photo-frame')||t.id==='pinnedNote'||t.id==='guestbookPanel'))return;t=t.parentElement;}
    handleBloomTap(e.clientX,e.clientY);
  });
})();

// 6. PARALLAX DEPTH LAYERS (3 transparent overlay layers)
// ─────────────────────────────────────────────────────────────
(function ParallaxLayers(){
  var world = document.getElementById('world');
  // 3 transparent decorative layers with different parallax speeds
  var layerData = [
    {id:'pxLayer0', speed:0.15, zIndex:2,  opacity:0.0},  // farthest — just position carrier
    {id:'pxLayer1', speed:0.35, zIndex:8,  opacity:0.0},  // mid
    {id:'pxLayer2', speed:0.6,  zIndex:18, opacity:0.0},  // nearest
  ];
  var layers = layerData.map(function(ld){
    var el = document.createElement('div');
    el.id = ld.id;
    el.style.cssText = 'position:absolute;inset:0;pointer-events:none;z-index:'+ld.zIndex+';will-change:transform;';
    world.appendChild(el);
    return {el:el, speed:ld.speed};
  });

  // Override pan to apply differential speeds
  var origApplyPan = null;
  var baseX=0, baseY=0;

  // Hook into pan updates via MutationObserver on world transform
  var prevTransform='';
  function updateParallax(){
    var t = document.getElementById('world').style.transform;
    if(t===prevTransform) return;
    prevTransform = t;
    var m = t.match(/translate3d\((-?\d+(?:\.\d+)?)px,(-?\d+(?:\.\d+)?)px/);
    if(!m) return;
    var tx=parseFloat(m[1]), ty=parseFloat(m[2]);
    layers.forEach(function(l){
      var lx = tx*l.speed, ly = ty*l.speed;
      l.el.style.transform='translate3d('+Math.round(lx)+'px,'+Math.round(ly)+'px,0)';
    });
  }
  setInterval(updateParallax, 16);

  // Seasonal floating particles on layer1 (mid)
  var pCanvas = document.createElement('canvas');
  pCanvas.style.cssText='position:absolute;top:0;left:0;pointer-events:none;width:100%;height:100%;';
  layers[1].el.appendChild(pCanvas);
  function resizePCanvas(){ pCanvas.width=world.offsetWidth; pCanvas.height=world.offsetHeight; }
  resizePCanvas();

  var pCtx = pCanvas.getContext('2d');
  var pFrame=0;
  function drawParallaxParticles(){
    pFrame++;
    pCtx.clearRect(0,0,pCanvas.width,pCanvas.height);
    var W2=pCanvas.width, H2=pCanvas.height;
    var season=window._currentSeason||'spring';

    if(season==='winter'&&window._snowflakes){
      pCtx.save();
      window._snowflakes.forEach(function(s){
        s.wob+=0.018; s.x+=s.vx+Math.sin(s.wob)*0.3; s.y+=s.vy;
        if(s.y>H2+10){s.y=-10;s.x=Math.random()*W2;}
        pCtx.beginPath(); pCtx.arc(s.x,s.y,s.r,0,6.28);
        pCtx.fillStyle='rgba(255,255,255,'+s.alpha+')'; pCtx.fill();
      });
      pCtx.restore();
    }
    if(season==='autumn'&&window._leaves){
      pCtx.save();
      window._leaves.forEach(function(l){
        l.wob+=0.022; l.x+=l.vx+Math.sin(l.wob)*0.5; l.y+=l.vy; l.rot+=l.rv;
        if(l.y>H2+20){l.y=-20;l.x=Math.random()*W2;}
        pCtx.save(); pCtx.translate(l.x,l.y); pCtx.rotate(l.rot);
        pCtx.beginPath(); pCtx.ellipse(0,0,l.sz,l.sz*0.6,0,0,6.28);
        pCtx.fillStyle=l.col; pCtx.globalAlpha=0.7; pCtx.fill();
        pCtx.restore();
      });
      pCtx.globalAlpha=1; pCtx.restore();
    }
    // Dust motes (all seasons) — react to touch proximity
    if(window._dustMotes){
      var tx=window._touchX||-999, ty=window._touchY||-999;
      pCtx.save();
      window._dustMotes.forEach(function(d){
        d.phase+=d.sp; d.x+=d.vx+Math.sin(d.phase)*0.2; d.y+=d.vy;
        if(d.x<0)d.x=W2; if(d.x>W2)d.x=0; if(d.y<0)d.y=H2; if(d.y>H2)d.y=0;
        // Repel from touch/cursor
        var dx2=d.x-(tx-(window._panX||0)), dy2=d.y-(ty-(window._panY||0));
        var dist=Math.sqrt(dx2*dx2+dy2*dy2);
        if(dist<100&&dist>0){d.vx+=dx2/dist*0.15;d.vy+=dy2/dist*0.15;}
        d.vx*=0.96; d.vy*=0.96;
        var alpha=0.15+0.2*(0.5+0.5*Math.sin(d.phase*0.5));
        pCtx.beginPath(); pCtx.arc(d.x,d.y,d.r,0,6.28);
        pCtx.fillStyle='rgba(255,240,200,'+alpha+')'; pCtx.fill();
      });
      pCtx.restore();
    }
    requestAnimationFrame(drawParallaxParticles);
  }

  // Init dust motes
  window._dustMotes=[];
  for(var i=0;i<50;i++){
    window._dustMotes.push({
      x:Math.random()*2000, y:Math.random()*1400,
      vx:(Math.random()-0.5)*0.3, vy:(Math.random()-0.5)*0.15,
      r:1+Math.random()*1.5, phase:Math.random()*6.28, sp:Math.random()*0.025+0.008
    });
  }

  // Track touch/mouse for dust repel
  document.addEventListener('touchmove',function(e){ window._touchX=e.touches[0].clientX;window._touchY=e.touches[0].clientY; },{passive:true});
  document.addEventListener('mousemove',function(e){ window._touchX=e.clientX;window._touchY=e.clientY; },{passive:true});

  drawParallaxParticles();
})();

// ── Fix 2: Season canvas color overlay on bgCanvas ──
// Subtly tints the sky to match the season accent colors
(function seasonSkyTint(){
  var world = document.getElementById('world');
  if(!world || !window._seasonData) return;
  var tintCanvas = document.createElement('canvas');
  tintCanvas.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:3;opacity:0.0;transition:opacity 2s ease;';
  tintCanvas.width  = world.offsetWidth;
  tintCanvas.height = world.offsetHeight;
  world.appendChild(tintCanvas);
  var tc = tintCanvas.getContext('2d');
  var s  = window._seasonData;

  function drawTint(){
    var W2=tintCanvas.width, H2=tintCanvas.height;
    tc.clearRect(0,0,W2,H2);
    var g = tc.createLinearGradient(0,0,0,H2*.55);
    // Parse accent colors to RGBA with low opacity
    var opTop=0.06, opBot=0.03;
    if(window._currentSeason==='autumn') { opTop=0.1; opBot=0.05; }
    if(window._currentSeason==='winter') { opTop=0.07; opBot=0.04; }
    g.addColorStop(0, hexToRgba(s.sky1, opTop));
    g.addColorStop(1, hexToRgba(s.sky2, opBot));
    tc.fillStyle=g; tc.fillRect(0,0,W2,H2*.55);
  }

  function hexToRgba(hex, alpha){
    var r=0,g2=0,b=0;
    hex=hex.replace('#','');
    if(hex.length===3){ hex=hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2]; }
    r=parseInt(hex.slice(0,2),16);
    g2=parseInt(hex.slice(2,4),16);
    b=parseInt(hex.slice(4,6),16);
    return 'rgba('+r+','+g2+','+b+','+alpha+')';
  }

  drawTint();
  setTimeout(function(){ tintCanvas.style.opacity='1'; }, 1000);
})();

// ── Enhancement: Interactive Flora — add ripple bloom on ground tap ──
(function bloomRippleEnhance(){
  var bloomCanvas = document.createElement('canvas');
  bloomCanvas.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:28;';
  var world = document.getElementById('world');
  if(!world) return;
  bloomCanvas.width  = world.offsetWidth;
  bloomCanvas.height = world.offsetHeight;
  world.appendChild(bloomCanvas);
  var bCtx = bloomCanvas.getContext('2d');

  var bloomRipples = [];
  window.spawnBloomRipple = function(wx, wy, color){
    bloomRipples.push({x:wx, y:wy, r:0, life:1, maxR:60, color:color||'rgba(255,182,193,'});
  };

  // Hook into existing handleBloomTap
  var _origBloom = window.spawnButterflies;

  function drawBloomRipples(){
    bCtx.clearRect(0,0,bloomCanvas.width,bloomCanvas.height);
    for(var i=bloomRipples.length-1;i>=0;i--){
      var rp = bloomRipples[i];
      rp.life -= 0.018;
      rp.r    += (rp.maxR - rp.r) * 0.06;
      if(rp.life <= 0){ bloomRipples.splice(i,1); continue; }
      // Outer ring
      bCtx.beginPath(); bCtx.arc(rp.x, rp.y, rp.r, 0, 6.28);
      bCtx.strokeStyle = rp.color + (rp.life * 0.6) + ')';
      bCtx.lineWidth = 2.5 * rp.life; bCtx.stroke();
      // Petal ring
      for(var p=0;p<6;p++){
        var pa = (Math.PI/3)*p + (1-rp.life)*2;
        var px2 = rp.x + Math.cos(pa)*rp.r*0.7;
        var py2 = rp.y + Math.sin(pa)*rp.r*0.7;
        bCtx.beginPath(); bCtx.arc(px2, py2, 4*rp.life, 0, 6.28);
        bCtx.fillStyle = rp.color + (rp.life * 0.7) + ')';
        bCtx.fill();
      }
    }
    requestAnimationFrame(drawBloomRipples);
  }
  drawBloomRipples();

  // Intercept touch/click to also spawn world bloom ripple
  document.addEventListener('touchend', function(e){
    if(e.changedTouches.length===0) return;
    var cx=e.changedTouches[0].clientX, cy=e.changedTouches[0].clientY;
    var wx=cx-(window._panX||0), wy=cy-(window._panY||0);
    var gy=window._groundY||500;

      var season=window._currentSeason||'spring';
      var cols={'spring':'rgba(255,182,193,','summer':'rgba(255,220,100,','autumn':'rgba(255,140,50,','winter':'rgba(200,230,255,'};
      window.spawnBloomRipple(wx, wy, cols[season]||'rgba(255,182,193,');
    }
  },{passive:true});
})();

(function cursorTrailEnhance(){
  var trailCanvas = document.createElement('canvas');

  var tCtx = trailCanvas.getContext('2d');

  var trail = [];
  var MAX_TRAIL = 22;
  for(var i=0;i<MAX_TRAIL;i++) trail.push({x:-999,y:-999,life:0});
  var tIdx = 0;
  var lastX=-999, lastY=-999;
  var isMoving = false, moveTimer = null;

  function addPoint(x, y){
    // Only emit during active pan/drag
    if(!isMoving) return;
    var t = trail[tIdx%MAX_TRAIL]; tIdx++;
    t.x=x; t.y=y; t.life=1;
  }

  document.addEventListener('touchmove',function(e){
    isMoving=true;
    clearTimeout(moveTimer);
    moveTimer=setTimeout(function(){isMoving=false;},150);
    addPoint(e.touches[0].clientX, e.touches[0].clientY);
  },{passive:true});
  document.addEventListener('mousemove',function(e){
    isMoving=true;
    clearTimeout(moveTimer);
    moveTimer=setTimeout(function(){isMoving=false;},150);

  },{passive:true});

  var season = window._currentSeason||'spring';
  var trailCols = {spring:'rgba(255,182,210,',summer:'rgba(255,230,120,',autumn:'rgba(255,160,60,',winter:'rgba(180,220,255,'};

  function drawTrail(){
